name: Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - README.md
      - ARCHITECTURE_SYSTEM.md
      - ARCHITECTURE.md
      - ARCHITECTURE_SCORECARD.md
      - AGENTS.md
      - LICENSE.md
      - docs/**
      - website/mind/**
      - metadata/const.py
      - tests/website/**
      - frontends/cli/arguments.py
      - frontends/tui/prompting/commands.py
      - .github/workflows/sync-to-software-center.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - ARCHITECTURE_SYSTEM.md
      - ARCHITECTURE.md
      - ARCHITECTURE_SCORECARD.md
      - AGENTS.md
      - LICENSE.md
      - docs/**
      - website/mind/**
      - metadata/const.py
      - tests/website/**
      - frontends/cli/arguments.py
      - frontends/tui/prompting/commands.py
      - .github/workflows/sync-to-software-center.yml
  workflow_dispatch:

concurrency:
  group: sync-to-software-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v5

      - name: Install documentation test dependency
        run: python -m pip install pytest

      - name: Set up website Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: website/mind/.node-version
          cache: npm
          cache-dependency-path: website/mind/package-lock.json

      - name: Test documentation publication contract
        run: python -m pytest tests/website -q

      - name: Validate source and generated documentation
        run: |
          python website/mind/scripts/check_docs.py
          python website/mind/scripts/sync_docs.py
          python website/mind/scripts/check_docs.py --generated

      - name: Build and validate published HTML
        working-directory: website/mind
        run: |
          npm ci
          npm run build

      - name: Check browser behavior and accessibility
        working-directory: website/mind
        run: |
          npx playwright install --with-deps chromium
          npm test

  sync_docs_bundle:
    needs: validate_docs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v5

      - name: Set variables
        run: |
          echo "DOCS_TARGET_DIR=SoftwareCenter/Assets/Mind" >> $GITHUB_ENV
          echo "SITE_TARGET_DIR=SoftwareCenter/site/mind" >> $GITHUB_ENV
          echo "REPO_NAME=Mind" >> $GITHUB_ENV

      - name: Clone public SoftwareCenter repo
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git clone https://x-access-token:${GH_TOKEN}@github.com/PlaxtonFlarion/SoftwareCenter.git SoftwareCenter

      - name: Build website reference docs
        run: |
          python website/mind/scripts/check_docs.py
          python website/mind/scripts/sync_docs.py
          python website/mind/scripts/check_docs.py --generated

      - name: Copy documentation and website shell to target repo
        run: |
          mkdir -p $DOCS_TARGET_DIR
          mkdir -p $SITE_TARGET_DIR
          mkdir -p $DOCS_TARGET_DIR/metadata
          cp README.md ARCHITECTURE_SYSTEM.md ARCHITECTURE.md ARCHITECTURE_SCORECARD.md AGENTS.md LICENSE.md $DOCS_TARGET_DIR/
          cp metadata/const.py $DOCS_TARGET_DIR/metadata/
          rsync -a --delete docs/ $DOCS_TARGET_DIR/docs/
          rsync -a --delete \
            --exclude node_modules --exclude .astro --exclude site \
            --exclude __pycache__ --exclude test-results --exclude playwright-report \
            --exclude src/generated --exclude src/content/docs/generated \
            website/mind/ $SITE_TARGET_DIR/

      - name: Push to SoftwareCenter (only if changed)
        run: |
          cd SoftwareCenter
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit. Skipping push."
          else
            git commit -m "Sync docs bundle for $REPO_NAME"
            git push
          fi
