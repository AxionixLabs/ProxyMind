<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mind Agent</title>
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="shortcut icon" href="/static/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Mind" />
  <link rel="manifest" href="/static/site.webmanifest" />
  <style>
    :root{
      --bg:#0d141b;
      --fg:#e6edf3;
      --muted:#8fa1ae;
      --line:rgba(255,255,255,.08);
      --accent:#8ecae6;
      --accent2:#b7c9d6;
      --ok:#8ecae6;
      --warn:#d8b56d;
      --danger:#e07a7a;
      --shadow:0 30px 90px rgba(0,0,0,.65);
      --surface-top:rgba(255,255,255,.06);
      --surface-bottom:rgba(255,255,255,.03);
      --surface-hero-top:rgba(255,255,255,.05);
      --surface-hero-bottom:rgba(255,255,255,.02);
      --surface-inset:rgba(142,202,230,.06);
      --surface-inset-soft:rgba(142,202,230,.04);
      --surface-border-soft:rgba(255,255,255,.10);
      --surface-border-faint:rgba(255,255,255,.08);
      --surface-fill:rgba(0,0,0,.16);
      --surface-fill-soft:rgba(0,0,0,.14);
      --surface-fill-strong:rgba(0,0,0,.18);
      --surface-hover:rgba(255,255,255,.04);
      --accent-fill:rgba(142,202,230,.08);
      --accent-fill-strong:rgba(142,202,230,.10);
      --accent-fill-solid:rgba(142,202,230,.9);
      --accent-border:rgba(142,202,230,.32);
      --accent-border-soft:rgba(142,202,230,.18);
      --accent-ink:rgba(0,0,0,.85);
      --accent-shadow:rgba(142,202,230,.25);
      --accent2-fill:rgba(183,201,214,.10);
      --accent2-fill-strong:rgba(183,201,214,.14);
      --danger-fill:rgba(224,122,122,.10);
      --danger-fill-strong:rgba(224,122,122,.16);
      --title-text:rgba(230,237,243,.96);
      --title-sheen:rgba(255,255,255,.92);
      --title-glow:rgba(142,202,230,.22);
      --title-beam-soft:rgba(183,201,214,.18);
      --title-beam-strong:rgba(142,202,230,.88);
      --grid-line:rgba(255,255,255,.04);
      --dot-danger:#e07a7a;
      --dot-warn:#d8b56d;
      --dot-ok:#9fd3c7;
      --footer-fg:rgba(143,161,174,.85);
    }
    *{box-sizing:border-box}
    html{
      min-height:100%;
      overflow-y:scroll;
      scrollbar-gutter:stable;
      scrollbar-width:thin;
      scrollbar-color:rgba(255,255,255,.14) transparent;
    }
    html::-webkit-scrollbar{
      width:8px;
      height:8px;
    }
    html::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.14);
      border-radius:999px;
    }
    html::-webkit-scrollbar-track{
      background:transparent;
    }
    body{min-height:100%}
    body{
      margin:0;
      color:var(--fg);
      background:
        radial-gradient(900px 540px at 18% 8%, var(--accent2-fill), transparent 58%),
        radial-gradient(760px 480px at 82% 14%, var(--accent-fill), transparent 60%),
        #0d141b;
      font:14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }
    .grid{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.22;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size:44px 44px;
      mask-image:radial-gradient(800px 520px at 50% 15%, #000 42%, transparent 82%);
    }
    .wrap{
      width:90%;
      margin:28px auto 40px;
      display:grid;
      gap:16px;
    }
    .card{
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(180deg, var(--surface-top), var(--surface-bottom));
      box-shadow:
        var(--shadow),
        0 0 0 1px var(--surface-inset) inset;
      overflow:hidden;
      position:relative;
      backdrop-filter:blur(10px);
    }
    .main-panel-card{
      min-height:320px;
      display:flex;
      flex-direction:column;
    }
    .main-panel-card > .pad,
    .main-panel-card > .section{
      flex:1 1 auto;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(700px 260px at 20% 0%, var(--accent-fill), transparent 56%),
        radial-gradient(700px 240px at 100% 0%, var(--accent2-fill), transparent 58%);
    }
    .bar{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 18px;
      min-height:52px;
      border-bottom:1px solid var(--surface-border-faint);
      background:var(--surface-fill);
      box-sizing:border-box;
    }
    .bar-start,
    .bar-end{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .bar-start{flex-wrap:nowrap}
    .bar-end{
      flex:0 0 auto;
      justify-content:flex-end;
      flex-wrap:wrap;
    }
    .dots{display:flex; gap:8px}
    .dots i{display:block; width:10px; height:10px; border-radius:999px}
    .dots i:nth-child(1){background:var(--dot-danger)}
    .dots i:nth-child(2){background:var(--dot-warn)}
    .dots i:nth-child(3){background:var(--dot-ok)}
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--surface-border-soft);
      background:var(--surface-fill);
      white-space:nowrap;
    }
    .status-chip{
      flex:0 0 18ch;
      width:18ch;
      min-width:18ch;
      max-width:18ch;
      justify-content:center;
      text-align:center;
      font-variant-numeric:tabular-nums;
      overflow:hidden;
    }
    .pad,
    .section{
      position:relative;
      z-index:1;
      padding:22px 18px;
    }
    .eyebrow{
      color:var(--accent);
      letter-spacing:.16em;
      text-transform:uppercase;
      font-size:12px;
    }
    h1{
      margin:8px 0 0;
      font-size:34px;
      letter-spacing:.10em;
      text-transform:uppercase;
      text-shadow:0 0 18px var(--title-glow);
    }
    .hero-title{
      position:relative;
      display:inline-block;
    }
    .signal-title{
      position:relative;
      display:inline-block;
      padding:0 0 10px;
      color:var(--title-text);
      overflow:hidden;
    }
    .signal-title::before{
      content:attr(data-text);
      position:absolute;
      inset:0;
      pointer-events:none;
      color:transparent;
      background:linear-gradient(
        115deg,
        transparent 0%,
        transparent 36%,
        var(--title-sheen) 48%,
        var(--title-beam-strong) 52%,
        transparent 64%,
        transparent 100%
      );
      background-size:220% 100%;
      -webkit-background-clip:text;
      background-clip:text;
      animation:titleSweep 4.8s ease-in-out infinite;
      opacity:.95;
    }
    .signal-title::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:2px;
      border-radius:999px;
      background:linear-gradient(90deg, var(--title-beam-soft), var(--title-beam-strong) 50%, var(--title-beam-soft));
      box-shadow:0 0 0 1px var(--surface-inset), 0 0 16px var(--title-glow);
      transform-origin:left center;
      animation:titleBeam 3.8s ease-in-out infinite;
    }
    @keyframes titleSweep{
      0%, 16%{background-position:160% 0; opacity:0}
      28%{opacity:.98}
      52%{background-position:30% 0; opacity:.9}
      72%, 100%{background-position:-80% 0; opacity:0}
    }
    @keyframes titleBeam{
      0%, 100%{transform:scaleX(.22); opacity:.45}
      45%{transform:scaleX(1); opacity:1}
      70%{transform:scaleX(.72); opacity:.7}
    }
    .sub{
      margin:12px 0 0;
      max-width:80ch;
      color:var(--muted);
      line-height:1.55;
    }
    .shell-nav{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:18px;
      align-items:flex-start;
    }
    .shell-nav-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      width:148px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--surface-border-faint);
      background:var(--surface-fill);
      color:var(--fg);
      text-decoration:none;
      font-size:12px;
      white-space:nowrap;
      text-align:center;
      transition:border-color .12s ease, background .12s ease;
    }
    .shell-nav-link:hover{
      border-color:var(--accent-border);
      background:var(--surface-hover);
    }
    .shell-nav-link.active{
      border-color:var(--accent-border-soft);
      background:var(--accent-fill);
      color:var(--accent);
    }
    .hero-tools-section{
      position:relative;
      display:flex;
      align-items:center;
      min-height:60px;
      padding:10px 18px;
      border:1px solid var(--surface-border-faint);
      border-radius:18px;
      background:linear-gradient(180deg, var(--surface-hero-top), var(--surface-hero-bottom));
      box-shadow:
        0 24px 60px rgba(0,0,0,.28),
        0 0 0 1px var(--surface-inset-soft) inset;
    }
    .tool-strip{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      flex-wrap:wrap;
      width:100%;
      min-width:0;
    }
    .hero-tools{
      margin-top:0;
      width:100%;
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto;
      gap:12px;
      align-items:center;
    }
    .hero-tools-group{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      min-width:0;
    }
    .hero-tools-group--actions{justify-content:flex-start}
    .hero-tools-group--status{justify-content:flex-end}
    .hero-tools a,
    .hero-tools button,
    .hero-tools label[for]{
      cursor:pointer;
    }
    .hero-head-pad{
      min-height:156px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }
    .ghost-btn,
    .primary-btn{
      appearance:none;
      border-radius:12px;
      padding:10px 14px;
      font-size:12px;
      letter-spacing:.04em;
      min-height:40px;
      line-height:1.2;
      font-weight:500;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:border-color .12s ease, transform .12s ease, background .12s ease;
    }
    .hero-tools .hero-tool-mark{
      appearance:none;
      position:relative;
      isolation:isolate;
      overflow:hidden;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:144px;
      min-height:32px;
      padding:0 14px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:999px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 42%, rgba(255,255,255,0) 100%),
        linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,0) 48%),
        var(--accent-fill-solid);
      color:var(--accent-ink);
      text-decoration:none;
      cursor:pointer;
      font-size:11px;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
      line-height:1.2;
      white-space:nowrap;
      text-align:center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05) inset,
        0 12px 28px rgba(0,0,0,.18),
        0 0 18px var(--accent-shadow);
      transition:border-color .14s ease, transform .14s ease, box-shadow .14s ease, filter .14s ease, opacity .14s ease;
    }
    .hero-tools .hero-tool-mark::before{
      content:"";
      position:absolute;
      inset:1px;
      border-radius:inherit;
      background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0));
      opacity:.28;
      pointer-events:none;
    }
    .hero-tools .hero-tool-mark:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,.16);
      filter:brightness(1.03) saturate(1.04);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.06) inset,
        0 16px 32px rgba(0,0,0,.2),
        0 0 22px var(--accent-shadow);
    }
    .hero-tools .hero-tool-mark:active{
      transform:translateY(0);
      filter:brightness(.99);
    }
    .hero-tools .hero-tool-mark:focus-visible{
      outline:none;
      border-color:rgba(255,255,255,.22);
      box-shadow:
        0 0 0 3px rgba(255,255,255,.08),
        0 0 0 1px rgba(255,255,255,.06) inset,
        0 16px 32px rgba(0,0,0,.2),
        0 0 22px var(--accent-shadow);
    }
    .hero-tools .hero-tool-mark:disabled,
    .hero-tools .hero-tool-mark[disabled],
    .hero-tools .hero-tool-mark[aria-disabled="true"]{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }
    .page-content-grid{
      display:grid;
      gap:16px;
      align-items:start;
      align-content:start;
    }
    .section-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }
    .section-title-wrap{
      flex:1 1 auto;
      min-width:0;
    }
    .section-title{
      margin:0;
      font-size:18px;
      letter-spacing:.03em;
      font-weight:600;
    }
    .section-tools{
      min-width:0;
      flex:0 0 auto;
    }
    .section-head .tool-strip{
      width:auto;
    }
    .tool-strip .primary-btn,
    .tool-strip .ghost-btn{
      min-height:34px;
      padding:0 12px;
      border-radius:999px;
      font-size:11px;
      letter-spacing:.08em;
      text-transform:uppercase;
      white-space:nowrap;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.04) inset,
        0 10px 24px rgba(0,0,0,.16);
    }
    .tool-strip .primary-btn{
      border:1px solid rgba(142,202,230,.28);
      background:
        linear-gradient(180deg, rgba(142,202,230,.18), rgba(142,202,230,.08)),
        rgba(7,18,24,.86);
      color:#dcfff5;
    }
    .tool-strip .ghost-btn{
      border:1px solid rgba(255,255,255,.12);
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
        rgba(7,12,18,.88);
      color:rgba(230,237,243,.92);
    }
    .tool-strip .primary-btn:hover{
      border-color:rgba(142,202,230,.42);
      background:
        linear-gradient(180deg, rgba(142,202,230,.24), rgba(142,202,230,.10)),
        rgba(8,20,26,.9);
    }
    .tool-strip .ghost-btn:hover{
      border-color:rgba(183,201,214,.28);
      background:
        linear-gradient(180deg, rgba(183,201,214,.08), rgba(255,255,255,.03)),
        rgba(9,14,22,.92);
    }
    .tool-strip .primary-btn:active{
      transform:translateY(1px);
      border-color:rgba(142,202,230,.52);
      background:
        linear-gradient(180deg, rgba(142,202,230,.14), rgba(142,202,230,.06)),
        rgba(6,16,22,.94);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.04) inset,
        0 6px 14px rgba(0,0,0,.14);
    }
    .tool-strip .ghost-btn:active{
      transform:translateY(1px);
      border-color:rgba(183,201,214,.38);
      background:
        linear-gradient(180deg, rgba(183,201,214,.05), rgba(255,255,255,.02)),
        rgba(7,12,20,.96);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.04) inset,
        0 6px 14px rgba(0,0,0,.14);
    }
    .tool-strip .primary-btn:disabled,
    .tool-strip .ghost-btn:disabled{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
      filter:none;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.04) inset,
        0 6px 14px rgba(0,0,0,.10);
    }
    .filter-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:16px;
    }
    .filter-chip{
      appearance:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:14ch;
      min-width:14ch;
      max-width:14ch;
      min-height:34px;
      box-sizing:border-box;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(0,0,0,.14);
      color:var(--muted);
      border-radius:999px;
      padding:7px 12px;
      font-size:12px;
      cursor:pointer;
      transition:border-color .12s ease, color .12s ease, background .12s ease;
      font:inherit;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
    }
    .filter-chip.active{
      border-color:rgba(142,202,230,.22);
      background:rgba(142,202,230,.10);
      color:var(--accent);
    }
    .console{
      min-height:420px;
      padding:14px;
      border:1px solid rgba(255,255,255,.06);
      border-radius:16px;
      background:rgba(3,8,12,.82);
      box-shadow:0 0 0 1px rgba(142,202,230,.05) inset;
      font:12px/1.42 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      word-break:break-word;
      color:#dbe9ef;
    }
    .entry{
      display:grid;
      gap:6px;
      padding:8px 10px 8px 14px;
      border-bottom:1px solid rgba(255,255,255,.04);
      position:relative;
    }
    .entry:last-child{border-bottom:none}
    .entry::before{
      content:"";
      position:absolute;
      left:0;
      top:8px;
      bottom:8px;
      width:2px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
    }
    .entry-head{
      display:grid;
      grid-template-columns:176px 76px auto 48px;
      gap:10px;
      align-items:start;
    }
    .entry-no{
      font-size:11px;
      color:rgba(143,161,174,.72);
      text-align:right;
      justify-self:end;
      user-select:none;
    }
    .entry-time{
      font-size:11px;
      color:#b8c9d1;
      white-space:nowrap;
    }
    .entry-lines{
      color:var(--muted);
      white-space:nowrap;
      font-size:10px;
      letter-spacing:.04em;
      text-transform:uppercase;
      justify-self:end;
    }
    .entry-level{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:64px;
      padding:1px 6px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      font-size:10px;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .entry-text{
      min-width:0;
      margin:0;
      color:#dbe9ef;
      white-space:pre-wrap;
      line-height:1.4;
    }
    .entry[data-level="INFO"]::before{background:rgba(230,237,243,.16)}
    .entry[data-level="DEBUG"]::before{background:rgba(154,215,255,.28)}
    .entry[data-level="WARNING"]::before{background:rgba(255,210,122,.38)}
    .entry[data-level="ERROR"]::before,
    .entry[data-level="CRITICAL"]::before{background:rgba(255,154,187,.44)}
    .entry[data-level="INFO"] .entry-level{color:#e6edf3;border-color:rgba(230,237,243,.12)}
    .entry[data-level="DEBUG"] .entry-level{color:#9ad7ff;border-color:rgba(154,215,255,.18)}
    .entry[data-level="WARNING"] .entry-level{color:#d8b56d;border-color:rgba(255,210,122,.18)}
    .entry[data-level="ERROR"] .entry-level,
    .entry[data-level="CRITICAL"] .entry-level{color:#ff9abb;border-color:rgba(255,154,187,.22)}
    .entry:hover{background:rgba(255,255,255,.02)}
    mark{
      padding:1px 4px;
      border-radius:6px;
      background:rgba(142,202,230,.16);
      color:var(--fg);
      box-shadow:0 0 0 1px rgba(142,202,230,.14) inset;
    }
    .empty{
      padding:20px 16px;
      border:1px dashed rgba(255,255,255,.10);
      border-radius:14px;
      color:var(--muted);
      background:rgba(0,0,0,.10);
      text-align:center;
    }
    .banner{
      position:fixed;
      top:50%;
      left:50%;
      width:min(520px, calc(100vw - 40px));
      min-width:min(320px, calc(100vw - 40px));
      padding:20px 22px;
      border-radius:22px;
      transform:translate(-50%, -50%) scale(.98);
      z-index:20;
      border:1px solid rgba(255,255,255,.10);
      background:
        radial-gradient(520px 220px at 20% 0%, rgba(142,202,230,.14), transparent 60%),
        radial-gradient(420px 200px at 100% 10%, rgba(183,201,214,.10), transparent 60%),
        rgba(6,14,20,.90);
      box-shadow:
        0 28px 80px rgba(0,0,0,.48),
        0 0 0 1px rgba(142,202,230,.08) inset;
      color:var(--fg);
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
      overflow:hidden;
    }
    .banner.show{
      opacity:1;
      transform:translate(-50%, -50%) scale(1);
    }
    .banner::before{
      content:"";
      position:absolute;
      inset:auto -12% 0 -12%;
      height:2px;
      background:linear-gradient(90deg, transparent, rgba(142,202,230,.92), rgba(183,201,214,.55), transparent);
      box-shadow:0 0 18px rgba(142,202,230,.28);
      opacity:.9;
      animation:bannerSweep 1.8s linear infinite;
    }
    .banner::after{
      content:"";
      position:absolute;
      inset:50% auto auto 50%;
      width:26px;
      height:26px;
      border-radius:999px;
      border:1px solid rgba(142,202,230,.30);
      transform:translate(-50%, -50%) scale(.24);
      opacity:0;
      pointer-events:none;
    }
    .banner.show::after{
      animation:bannerRipple .7s ease-out 1;
    }
    .banner.show:not(.err){
      animation:bannerConfirm .26s ease-out 1, bannerOkPulse 1s ease-in-out 1;
    }
    .banner.err{
      border-color:rgba(224,122,122,.22);
      background:
        radial-gradient(520px 220px at 20% 0%, rgba(224,122,122,.16), transparent 60%),
        radial-gradient(420px 200px at 100% 10%, rgba(183,201,214,.10), transparent 60%),
        rgba(20,8,14,.92);
      box-shadow:
        0 28px 80px rgba(0,0,0,.48),
        0 0 0 1px rgba(224,122,122,.10) inset;
    }
    .banner.err::before{
      background:linear-gradient(90deg, transparent, rgba(224,122,122,.92), rgba(183,201,214,.55), transparent);
      box-shadow:0 0 18px rgba(224,122,122,.35);
    }
    .banner.err::after{
      border-color:rgba(224,122,122,.34);
    }
    .banner.err.show{
      animation:bannerAlert .34s ease-out 1, bannerPulse 1.3s ease-in-out 2;
    }
    .banner strong{
      display:block;
      margin-bottom:10px;
      font-size:18px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .banner span{
      font-size:14px;
      line-height:1.65;
      color:var(--muted);
    }
    .page-footer-slot{
      padding:20px 0 24px;
    }
    .shell-footer{
      margin:0;
      text-align:center;
      color:var(--footer-fg);
      font-size:12px;
    }
    @keyframes bannerSweep{
      0%{transform:translateX(-28%)}
      100%{transform:translateX(28%)}
    }
    @keyframes bannerAlert{
      0%,100%{transform:translate(-50%, -50%) scale(1)}
      20%{transform:translate(-50%, -50%) translateX(-5px) scale(1.01)}
      40%{transform:translate(-50%, -50%) translateX(5px) scale(1.01)}
      60%{transform:translate(-50%, -50%) translateX(-3px) scale(1)}
      80%{transform:translate(-50%, -50%) translateX(3px) scale(1)}
    }
    @keyframes bannerConfirm{
      0%{transform:translate(-50%, -50%) scale(.975)}
      55%{transform:translate(-50%, -50%) scale(1.01)}
      100%{transform:translate(-50%, -50%) scale(1)}
    }
    @keyframes bannerPulse{
      0%,100%{
        box-shadow:
          0 28px 80px rgba(0,0,0,.48),
          0 0 0 1px rgba(224,122,122,.10) inset;
      }
      50%{
        box-shadow:
          0 28px 80px rgba(0,0,0,.48),
          0 0 0 1px rgba(224,122,122,.16) inset,
          0 0 28px rgba(224,122,122,.14);
      }
    }
    @keyframes bannerOkPulse{
      0%,100%{
        box-shadow:
          0 28px 80px rgba(0,0,0,.48),
          0 0 0 1px rgba(142,202,230,.08) inset;
      }
      50%{
        box-shadow:
          0 28px 80px rgba(0,0,0,.48),
          0 0 0 1px rgba(142,202,230,.14) inset,
          0 0 26px rgba(142,202,230,.12);
      }
    }
    @keyframes bannerRipple{
      0%{opacity:.4; transform:translate(-50%, -50%) scale(.24)}
      100%{opacity:0; transform:translate(-50%, -50%) scale(16)}
    }
    .snippet-tabs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:16px;
    }
    .snippet-output{
      min-height:220px;
      white-space:pre-wrap;
    }
    .json-output{
      min-height:0;
      white-space:pre-wrap;
    }
    .json-output.is-collapsed{
      max-height:240px;
      overflow:auto;
    }
    .detail-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
      align-items:start;
    }
    #summary-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:16px;
      align-items:start;
      align-content:start;
    }
    .mini-card{
      padding:16px;
      border:1px solid var(--surface-border-faint);
      border-radius:16px;
      background:var(--surface-fill-soft);
      display:grid;
      gap:8px;
    }
    .mini-card b{
      font-size:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .mini-card .value{
      font-size:15px;
      line-height:1.45;
      word-break:break-all;
    }
    .mini-card .meta{
      font-size:12px;
      color:var(--muted);
      word-break:break-all;
    }
    @media (max-width: 980px){
      .hero-tools{grid-template-columns:1fr}
      .hero-tools-group--status{justify-content:flex-start}
      .section-head{flex-direction:column; align-items:stretch}
    }
    @media (max-width: 720px){
      #summary-grid{grid-template-columns:1fr}
    }
    @media (prefers-reduced-motion: reduce){
      .signal-title::before,
      .signal-title::after,
      .banner,
      .banner::before,
      .banner::after{
        animation:none;
      }
      .signal-title::before{opacity:0}
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="banner" id="banner" aria-live="polite" aria-atomic="true"></div>

  <main class="wrap">
    <section class="card">
      <div class="bar">

      </div>
      <div class="pad hero-head-pad">
        <div class="eyebrow">Mind</div>
        <h1><span class="hero-title signal-title" data-text="Agent Nexus">Agent Nexus</span></h1>
        <p class="sub">查看当前 agent 会话下发的外部调用示例，并在多种运行时之间快速切换。</p>
        <div id="page-nav"></div>

    <section class="hero-tools-section">
      <div class="hero-tools">

    <section class="page-content-grid">
      <section class="card main-panel-card">
        <div class="bar">

            <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="chip">runtime snippets</div>
          </div>
        </div>
        <div class="section">
          <div class="section-head">
            <div class="section-title-wrap">
              <h2 class="section-title">Invocation Samples</h2>
            </div>

              <button class="primary-btn" type="button" id="copy-snippet">Copy</button>
            </div>
          </div>
          <div class="snippet-tabs" id="snippet-tabs"></div>
          <div class="console snippet-output" id="snippet-output">Waiting for agent example.</div>
        </div>
      </section>

      <div class="detail-grid">
        <section class="card">
          <div class="bar">
            <div class="bar-start">
              <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
              <div class="chip">request profile</div>
            </div>
          </div>
          <div class="section">
            <div class="section-head">
              <div class="section-title-wrap">
                <h2 class="section-title">Session Surface</h2>
              </div>
            </div>
            <div class="page-content-grid" id="summary-grid"></div>
          </div>
        </section>

        <section class="card">
          <div class="bar">
            <div class="bar-start">
              <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
              <div class="chip">request headers</div>
            </div>
          </div>
          <div class="section">
            <div class="section-head">
              <div class="section-title-wrap">
                <h2 class="section-title">Headers</h2>
              </div>
              <div class="section-tools tool-strip">
                <button class="primary-btn" type="button" id="copy-headers">Copy</button>
                <button class="ghost-btn" type="button" id="toggle-headers">▾</button>
              </div>
            </div>
            <div class="console json-output" id="headers-json">{}</div>
          </div>
        </section>

        <section class="card">
          <div class="bar">
            <div class="bar-start">
              <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
              <div class="chip">request body</div>
            </div>
          </div>
          <div class="section">
            <div class="section-head">
              <div class="section-title-wrap">
                <h2 class="section-title">Body</h2>
              </div>
              <div class="section-tools tool-strip">
                <button class="primary-btn" type="button" id="copy-body">Copy</button>
                <button class="ghost-btn" type="button" id="toggle-body">▾</button>
              </div>
            </div>
            <div class="console json-output" id="body-json">{}</div>
          </div>
        </section>
      </div>
    </section>

    <div class="page-footer-slot" id="page-footer"></div>
  </main>

  <script>
    function escapeHtml(value){
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function mountNav(targetId, nav, activeHref){
      const root = document.getElementById(targetId);
      if(!root) return;
      root.innerHTML = `
        <nav class="shell-nav" aria-label="workspace">
          ${nav.map((item) => `
            <a class="shell-nav-link${item.href === activeHref ? " active" : ""}" href="${item.href}">
              <span>${escapeHtml(item.title)}</span>
            </a>
          `).join("")}
        </nav>
      `;
    }

    function mountFooter(targetId, text){
      const root = document.getElementById(targetId);
      if(!root) return;
      root.innerHTML = `<div class="shell-footer">${escapeHtml(text)}</div>`;
    }

    function shellMessage(kind){
      const dict = {
        synced: ["Synced", "Agent example updated."],
        sync_failed: ["Sync Failed", "Unable to update agent example."],
        load_failed: ["Load Failed", "Agent example is not available yet."],
        copied: ["Copied", "Snippet copied to clipboard."],
        copied_headers: ["Copied", "Headers copied to clipboard."],
        copied_body: ["Copied", "Body copied to clipboard."]
      };
      return dict[kind] || ["Notice", ""];
    }

    mountNav("page-nav", [
      {title:"Workspace", href:"/"},
      {title:"Preferences", href:"/pref"},
      {title:"Code Studio", href:"/code"},
      {title:"Agent", href:"/agent"}
    ], "/agent");
    mountFooter("page-footer", "MIND · local server · v__APP_VERSION__");

    const banner = document.getElementById("banner");
    const summaryHost = document.getElementById("summary-grid");
    const tabsHost = document.getElementById("snippet-tabs");
    const snippetOutput = document.getElementById("snippet-output");
    const headersJson = document.getElementById("headers-json");
    const bodyJson = document.getElementById("body-json");
    const refreshTime = document.getElementById("refresh-time");
    const refreshButton = document.getElementById("refresh-agent");
    const copySnippetButton = document.getElementById("copy-snippet");
    const copyHeadersButton = document.getElementById("copy-headers");
    const copyBodyButton = document.getElementById("copy-body");
    const toggleHeadersButton = document.getElementById("toggle-headers");
    const toggleBodyButton = document.getElementById("toggle-body");
    const autoRefresh = document.getElementById("auto-refresh");
    const previewMode = location.protocol === "file:";
    const previewPayload = {
      session_id: "agent_session_preview",
      credential: "preview_credential_token_xyz_12345678",
      credential_tail: "12345678",
      has_credential: true,
      updated_at_ms: Date.now(),
      mind_call: {
        method: "POST",
        url: "https://xxx/mind",
        headers: {
          "Authorization": "Bearer preview_credential_token_xyz_12345678",
          "Content-Type": "application/json"
        },
        body: {
          message: "使用fast模式云端压测 https://files.appserverx.com/common/example.md"
        }
      }
    };
    const snippetKinds = [
      {key: "mac_curl", label: "Mac Curl"},
      {key: "windows_curl", label: "Windows Curl"},
      {key: "javascript", label: "JavaScript"},
      {key: "python", label: "Python"},
      {key: "java", label: "Java"}
    ];
    let agentData = previewPayload;
    let activeSnippet = detectDefaultSnippetKind();
    let headersCollapsed = true;
    let bodyCollapsed = true;
    let refreshTimer = null;
    let refreshTask = null;

    function showBanner(title, detail, kind = ""){
      banner.className = kind ? `banner show ${kind}` : "banner show";
      banner.innerHTML = `<strong>${title}</strong><span>${detail}</span>`;
      clearTimeout(showBanner.timer);
      showBanner.timer = setTimeout(() => banner.classList.remove("show"), 1800);
    }

    function fmtClock(date){
      return date.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
    }

    function fmtTime(ms){
      if(!ms) return "waiting";
      try{
        return new Date(ms).toLocaleString();
      }catch(_err){
        return "waiting";
      }
    }

    function fmtAgo(ms){
      if(!ms) return "pending";
      const delta = Math.max(0, Date.now() - ms);
      if(delta < 15000) return "just now";
      if(delta < 3600000) return `${Math.max(1, Math.floor(delta / 60000))}m ago`;
      if(delta < 86400000) return `${Math.max(1, Math.floor(delta / 3600000))}h ago`;
      return `${Math.max(1, Math.floor(delta / 86400000))}d ago`;
    }

    function syncState(updatedAtMs){
      if(!updatedAtMs) return {label: "pending", detail: "No local snapshot yet."};
      const delta = Math.max(0, Date.now() - updatedAtMs);
      if(delta < 120000) return {label: "fresh", detail: `Synced ${fmtAgo(updatedAtMs)}.`};
      if(delta < 600000) return {label: "aging", detail: `Synced ${fmtAgo(updatedAtMs)}.`};
      return {label: "stale", detail: `Synced ${fmtAgo(updatedAtMs)}.`};
    }

    function detectDefaultSnippetKind(){
      const fingerprint = `${navigator.platform || ""} ${navigator.userAgent || ""}`.toLowerCase();
      if(fingerprint.includes("win")) return "windows_curl";
      return "mac_curl";
    }

    function safeHeaders(value){
      if(!value || typeof value !== "object" || Array.isArray(value)) return {};
      return value;
    }

    function safeBody(value){
      if(value === null || value === undefined) return null;
      if(typeof value !== "object" || Array.isArray(value)) return null;
      return value;
    }

    function maskSecret(value){
      const raw = String(value || "");
      if(!raw) return "";
      if(raw.length <= 8) return "••••";
      return `${raw.slice(0, 3)}••••${raw.slice(-4)}`;
    }

    function maskAuthorization(value){
      const raw = String(value || "");
      const match = raw.match(/^(\S+\s+)(.+)$/);
      if(!match) return maskSecret(raw);
      return `${match[1]}${maskSecret(match[2])}`;
    }

    function maskHeaders(headers){
      return Object.fromEntries(Object.entries(headers || {}).map(([key, value]) => {
        if(String(key).toLowerCase() === "authorization") {
          return [key, maskAuthorization(value)];
        }
        return [key, value];
      }));
    }

    function maskCall(call){
      if(!call) return null;
      return {
        ...call,
        headers: maskHeaders(call.headers || {})
      };
    }

    function normalizeData(raw){
      const data = raw && typeof raw === "object" ? raw : {};
      const mindCallRaw = data.mind_call;
      const mindCall = mindCallRaw && typeof mindCallRaw === "object" && !Array.isArray(mindCallRaw)
        ? mindCallRaw
        : null;
      return {
        session_id: typeof data.session_id === "string" ? data.session_id : "",
        credential_tail: typeof data.credential_tail === "string" ? data.credential_tail : "",
        has_credential: Boolean(data.has_credential),
        updated_at_ms: Number.isFinite(Number(data.updated_at_ms)) ? Number(data.updated_at_ms) : 0,
        mind_call: mindCall ? {
          method: typeof mindCall.method === "string" ? mindCall.method.toUpperCase() : "",
          url: typeof mindCall.url === "string" ? mindCall.url : "",
          headers: safeHeaders(mindCall.headers),
          body: safeBody(mindCall.body)
        } : null
      };
    }

    function jsonPretty(value, fallback = "{}"){
      if(value === null) return "null";
      try{
        return JSON.stringify(value, null, 2);
      }catch(_err){
        return fallback;
      }
    }

    function jsonCompact(value, fallback = "{}"){
      if(value === null) return "null";
      try{
        return JSON.stringify(value);
      }catch(_err){
        return fallback;
      }
    }

    function escapeShellSingle(text){
      return String(text || "").replaceAll("'", "'\"'\"'");
    }

    function escapeCmdDouble(text){
      return String(text || "")
        .replaceAll("^", "^^")
        .replaceAll("%", "%%")
        .replaceAll("\"", "\\\"");
    }

    function escapeJava(text){
      return String(text || "")
        .replaceAll("\\", "\\\\")
        .replaceAll("\"", "\\\"")
        .replaceAll("\n", "\\n");
    }

    function buildMacCurl(call){
      const lines = [`curl -X ${call.method} "${call.url}"`];
      Object.entries(call.headers).forEach(([key, value]) => {
        if(!key || value === undefined || value === null || value === "") return;
        if(call.body && String(key).toLowerCase() === "content-type") return;
        lines.push(`  -H "${String(key)}: ${String(value)}"`);
      });
      if(call.body){
        lines.push(`  --json '${escapeShellSingle(jsonPretty(call.body, "{}"))}'`);
      }
      return lines.join(" \\\n");
    }

    function buildWindowsCurl(call){
      const lines = [`curl.exe -X ${call.method} "${call.url}"`];
      Object.entries(call.headers).forEach(([key, value]) => {
        if(!key || value === undefined || value === null || value === "") return;
        if(call.body && String(key).toLowerCase() === "content-type") return;
        lines.push(`  -H "${escapeCmdDouble(String(key))}: ${escapeCmdDouble(String(value))}"`);
      });
      if(call.body){
        lines.push(`  --json "${escapeCmdDouble(jsonCompact(call.body, "{}"))}"`);
      }
      return lines.join(" ^\n");
    }

    function buildJavaScript(call){
      const bodyBlock = call.body
        ? `  body: JSON.stringify(${jsonPretty(call.body, "{}")})\n`
        : "";
      return `const response = await fetch(${JSON.stringify(call.url)}, {\n` +
        `  method: ${JSON.stringify(call.method)},\n` +
        `  headers: ${jsonPretty(call.headers, "{}")},\n` +
        bodyBlock +
        `});\n\n` +
        `const text = await response.text();\n` +
        `console.log(response.status, text);`;
    }

    function buildPython(call){
      const bodyBlock = call.body
        ? `payload = json.loads(r'''${jsonPretty(call.body, "{}")}''')\n\nresponse = requests.request(${JSON.stringify(call.method)}, url, headers=headers, json=payload, timeout=30)`
        : `response = requests.request(${JSON.stringify(call.method)}, url, headers=headers, timeout=30)`;
      return `import json\nimport requests\n\n` +
        `url = ${JSON.stringify(call.url)}\n` +
        `headers = json.loads(r'''${jsonPretty(call.headers, "{}")}''')\n\n` +
        `${bodyBlock}\n` +
        `print(response.status_code)\n` +
        `print(response.text)`;
    }

    function buildJava(call){
      const headerLines = Object.entries(call.headers).map(([key, value]) => {
        return `    .header("${escapeJava(String(key))}", "${escapeJava(String(value))}")`;
      }).join("\n");
      const bodyText = call.body ? jsonCompact(call.body, "{}") : "";
      const publisher = call.body
        ? `HttpRequest.BodyPublishers.ofString(body)`
        : `HttpRequest.BodyPublishers.noBody()`;
      const bodyDecl = call.body
        ? `String body = "${escapeJava(bodyText)}";\n\n`
        : "";
      return `import java.net.URI;\n` +
        `import java.net.http.HttpClient;\n` +
        `import java.net.http.HttpRequest;\n` +
        `import java.net.http.HttpResponse;\n\n` +
        `HttpClient client = HttpClient.newHttpClient();\n` +
        `${bodyDecl}` +
        `HttpRequest request = HttpRequest.newBuilder()\n` +
        `    .uri(URI.create("${escapeJava(call.url)}"))\n` +
        `${headerLines ? headerLines + "\n" : ""}` +
        `    .method("${escapeJava(call.method)}", ${publisher})\n` +
        `    .build();\n\n` +
        `HttpResponse<String> response = client.send(request, HttpResponse.BodyHandlers.ofString());\n` +
        `System.out.println(response.statusCode());\n` +
        `System.out.println(response.body());`;
    }

    function snippetTextByKind(kind, call){
      if(!call) return "Waiting for agent example.";
      if(kind === "windows_curl") return buildWindowsCurl(call);
      if(kind === "javascript") return buildJavaScript(call);
      if(kind === "python") return buildPython(call);
      if(kind === "java") return buildJava(call);
      return buildMacCurl(call);
    }

    function renderSummary(data){
      const call = data.mind_call;
      if(!call){
        summaryHost.innerHTML = `<div class="empty">Open agent mode once, then this page will receive the latest external call example.</div>`;
        return;
      }
      const sync = syncState(data.updated_at_ms);

      summaryHost.innerHTML = `
        <div class="mini-card">
          <b>Request URL</b>
          <div class="value">${escapeHtml(call.url)}</div>
          <div class="meta">Current external entry for this agent session.</div>
        </div>
        <div class="mini-card">
          <b>Updated</b>
          <div class="value">${escapeHtml(fmtTime(data.updated_at_ms))}</div>
          <div class="meta">${escapeHtml(sync.detail)} State: ${escapeHtml(sync.label)}.</div>
        </div>
        <div class="mini-card">
          <b>Method</b>
          <div class="value">${escapeHtml(call.method || "--")}</div>
          <div class="meta">Request method used by the current external entry.</div>
        </div>
        <div class="mini-card">
          <b>Session ID</b>
          <div class="value">${escapeHtml(data.session_id || "pending")}</div>
          <div class="meta">Current agent session bound to this local page snapshot.</div>
        </div>
      `;
    }

    function renderSnippetTabs(){
      tabsHost.innerHTML = snippetKinds.map((item) => `
        <button class="filter-chip${item.key === activeSnippet ? " active" : ""}" type="button" data-kind="${item.key}">
          ${escapeHtml(item.label)}
        </button>
      `).join("");
    }

    function renderSnippet(){
      renderSnippetTabs();
      snippetOutput.textContent = snippetTextByKind(activeSnippet, maskCall(agentData.mind_call));
    }

    function setButtonEnabled(button, enabled){
      button.disabled = !enabled;
      button.setAttribute("aria-disabled", enabled ? "false" : "true");
    }

    function isFoldableText(text){
      const raw = String(text || "");
      return raw.length > 900 || raw.split("\n").length > 18;
    }

    function syncJsonPanel(panel, button, text, collapsed){
      const foldable = isFoldableText(text);
      panel.classList.toggle("is-collapsed", foldable && collapsed);
      button.hidden = !foldable;
      button.disabled = !foldable;
      button.textContent = foldable ? (collapsed ? "▾" : "▴") : "▾";
    }

    function syncCopyButtons(data){
      const call = data.mind_call;
      const headers = call ? (call.headers || {}) : {};
      setButtonEnabled(copySnippetButton, Boolean(call));
      setButtonEnabled(copyHeadersButton, Boolean(call) && Object.keys(headers).length > 0);
      setButtonEnabled(copyBodyButton, Boolean(call && call.body));
    }

    function renderRawRequest(data){
      const call = data.mind_call;
      if(!call){
        headersJson.textContent = "{}";
        bodyJson.textContent = "{}";
        syncJsonPanel(headersJson, toggleHeadersButton, "{}", true);
        syncJsonPanel(bodyJson, toggleBodyButton, "{}", true);
        return;
      }
      const headers = call.headers || {};
      const body = call.body;
      const headersDisplayText = jsonPretty(maskHeaders(headers), "{}");
      const bodyDisplayText = body ? jsonPretty(body, "{}") : "null";
      headersJson.textContent = headersDisplayText;
      bodyJson.textContent = bodyDisplayText;
      syncJsonPanel(headersJson, toggleHeadersButton, headersDisplayText, headersCollapsed);
      syncJsonPanel(bodyJson, toggleBodyButton, bodyDisplayText, bodyCollapsed);
    }

    function renderPage(){
      renderSummary(agentData);
      renderSnippet();
      renderRawRequest(agentData);
      syncCopyButtons(agentData);
    }

    function setRefreshStamp(text){
      refreshTime.textContent = text;
    }

    function setRefreshPending(pending){
      refreshButton.disabled = pending;
      refreshButton.setAttribute("aria-busy", pending ? "true" : "false");
    }

    async function loadAgent(options = {}){
      const {silent = false} = options;
      if(refreshTask) return refreshTask;
      refreshTask = (async () => {
        if(previewMode){
          agentData = normalizeData(previewPayload);
          renderPage();
          setRefreshStamp("preview mode");
          return;
        }
        setRefreshPending(true);
        setRefreshStamp("syncing");
        try{
          const resp = await fetch("/api/agent", {cache: "no-store"});
          if(!resp.ok) throw new Error("agent load failed");
          const payload = await resp.json();
          agentData = normalizeData(payload.data || {});
          renderPage();
          setRefreshStamp(`updated ${fmtClock(new Date())}`);
          if(!silent){
            const [title, detail] = shellMessage("synced");
            showBanner(title, detail, "");
          }
        }catch(err){
          setRefreshStamp("sync failed");
          throw err;
        }finally{
          setRefreshPending(false);
          refreshTask = null;
        }
      })();
      return refreshTask;
    }

    function scheduleRefresh(){
      if(refreshTimer){
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
      if(previewMode || !autoRefresh.checked) return;
      refreshTimer = setInterval(() => {
        loadAgent({silent:true}).catch(() => {
          const [title, detail] = shellMessage("sync_failed");
          showBanner(title, detail, "err");
        });
      }, 12000);
    }

    tabsHost.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-kind]");
      if(!button) return;
      activeSnippet = button.getAttribute("data-kind") || "mac_curl";
      renderSnippet();
    });

    refreshButton.addEventListener("click", () => {
      loadAgent().catch(() => {
        const [title, detail] = shellMessage("sync_failed");
        showBanner(title, detail, "err");
      });
    });
    autoRefresh.addEventListener("change", scheduleRefresh);

    copySnippetButton.addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText(snippetTextByKind(activeSnippet, agentData.mind_call));
        const [title, detail] = shellMessage("copied");
        showBanner(title, detail, "");
      }catch(_err){
        showBanner("Copy Failed", "Unable to copy the current snippet.", "err");
      }
    });
    copyHeadersButton.addEventListener("click", async () => {
      try{
        const call = agentData.mind_call;
        await navigator.clipboard.writeText(jsonPretty(call ? (call.headers || {}) : {}, "{}"));
        const [title, detail] = shellMessage("copied_headers");
        showBanner(title, detail, "");
      }catch(_err){
        showBanner("Copy Failed", "Unable to copy headers.", "err");
      }
    });
    copyBodyButton.addEventListener("click", async () => {
      try{
        const call = agentData.mind_call;
        await navigator.clipboard.writeText(call && call.body ? jsonPretty(call.body, "{}") : "null");
        const [title, detail] = shellMessage("copied_body");
        showBanner(title, detail, "");
      }catch(_err){
        showBanner("Copy Failed", "Unable to copy body.", "err");
      }
    });
    toggleHeadersButton.addEventListener("click", () => {
      headersCollapsed = !headersCollapsed;
      renderRawRequest(agentData);
    });
    toggleBodyButton.addEventListener("click", () => {
      bodyCollapsed = !bodyCollapsed;
      renderRawRequest(agentData);
    });

    setButtonEnabled(copySnippetButton, false);
    setButtonEnabled(copyHeadersButton, false);
    setButtonEnabled(copyBodyButton, false);
    toggleHeadersButton.hidden = true;
    toggleBodyButton.hidden = true;

    loadAgent().catch(() => {
      agentData = normalizeData({});
      renderPage();
      const [title, detail] = shellMessage("load_failed");
      showBanner(title, detail, "err");
    });
    scheduleRefresh();
  </script>
</body>
</html>
