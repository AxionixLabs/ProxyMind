<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Helix Idle</title>
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="shortcut icon" href="/static/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Helix" />
  <link rel="manifest" href="/static/site.webmanifest" />
  <style>
    :root{
      --bg:#0f100c;
      --fg:#f1eadc;
      --muted:#a79b83;
      --line:rgba(255,241,214,.10);
      --accent:#f0a04b;
      --accent2:#7fb7a1;
      --ok:#75c889;
      --warn:#e0b85f;
      --danger:#e46f61;
      --shadow:0 30px 90px rgba(0,0,0,.65);
      --surface-top:rgba(255,255,255,.06);
      --surface-bottom:rgba(255,255,255,.03);
      --surface-hero-top:rgba(255,255,255,.05);
      --surface-hero-bottom:rgba(255,255,255,.02);
      --surface-inset:rgba(240,160,75,.06);
      --surface-inset-soft:rgba(240,160,75,.04);
      --surface-border-soft:rgba(255,239,204,.12);
      --surface-border-faint:rgba(255,241,214,.10);
      --surface-fill:rgba(0,0,0,.16);
      --surface-fill-soft:rgba(0,0,0,.14);
      --surface-fill-strong:rgba(0,0,0,.18);
      --surface-hover:rgba(255,239,204,.045);
      --accent-fill:rgba(240,160,75,.08);
      --accent-fill-strong:rgba(240,160,75,.10);
      --accent-fill-solid:rgba(240,160,75,.9);
      --accent-border:rgba(240,160,75,.32);
      --accent-border-soft:rgba(240,160,75,.18);
      --accent-ink:rgba(18,13,6,.92);
      --accent-shadow:rgba(240,160,75,.25);
      --accent2-fill:rgba(127,183,161,.10);
      --accent2-fill-strong:rgba(127,183,161,.14);
      --danger-fill:rgba(228,111,97,.10);
      --danger-fill-strong:rgba(228,111,97,.16);
      --title-text:rgba(241,234,220,.96);
      --title-sheen:rgba(255,255,255,.92);
      --title-glow:rgba(240,160,75,.22);
      --title-beam-soft:rgba(127,183,161,.18);
      --title-beam-strong:rgba(240,160,75,.88);
      --grid-line:rgba(255,239,204,.045);
      --dot-danger:#e46f61;
      --dot-warn:#e0b85f;
      --dot-ok:#75c889;
      --footer-fg:rgba(167,155,131,.85);
    }
    *{box-sizing:border-box}
    html{
      min-height:100%;
      overflow-y:scroll;
      scrollbar-gutter:stable;
      scrollbar-width:thin;
      scrollbar-color:rgba(255,255,255,.14) transparent;
    }
    html::-webkit-scrollbar{
      width:8px;
      height:8px;
    }
    html::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.14);
      border-radius:999px;
    }
    html::-webkit-scrollbar-track{
      background:transparent;
    }
    body{min-height:100%}
    body{
      margin:0;
      color:var(--fg);
      background:
        radial-gradient(900px 540px at 18% 8%, var(--accent2-fill), transparent 58%),
        radial-gradient(760px 480px at 82% 14%, var(--accent-fill), transparent 60%),
        #0f100c;
      font:14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }
    .grid{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.22;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size:44px 44px;
      mask-image:radial-gradient(800px 520px at 50% 15%, #000 42%, transparent 82%);
    }
    .wrap{
      width:90%;
      margin:28px auto 40px;
      display:grid;
      gap:16px;
    }
    .card{
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(180deg, var(--surface-top), var(--surface-bottom));
      box-shadow:
        var(--shadow),
        0 0 0 1px var(--surface-inset) inset;
      overflow:hidden;
      position:relative;
      backdrop-filter:blur(10px);
    }
    .main-panel-card{
      min-height:320px;
      display:flex;
      flex-direction:column;
    }
    .main-panel-card > .pad,
    .main-panel-card > .section{
      flex:1 1 auto;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(700px 260px at 20% 0%, var(--accent-fill), transparent 56%),
        radial-gradient(700px 240px at 100% 0%, var(--accent2-fill), transparent 58%);
    }
    .bar{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 18px;
      min-height:52px;
      border-bottom:1px solid var(--surface-border-faint);
      background:var(--surface-fill);
      box-sizing:border-box;
    }
    .bar-start,
    .bar-end{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .bar-start{flex-wrap:nowrap}
    .bar-end{
      flex:0 0 auto;
      justify-content:flex-end;
      flex-wrap:wrap;
    }
    .dots{display:flex; gap:8px}
    .dots i{display:block; width:10px; height:10px; border-radius:999px}
    .dots i:nth-child(1){background:var(--dot-danger)}
    .dots i:nth-child(2){background:var(--dot-warn)}
    .dots i:nth-child(3){background:var(--dot-ok)}
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--surface-border-soft);
      background:var(--surface-fill);
      white-space:nowrap;
    }
    .status-chip{
      flex:0 0 18ch;
      width:18ch;
      min-width:18ch;
      max-width:18ch;
      justify-content:center;
      text-align:center;
      font-variant-numeric:tabular-nums;
      overflow:hidden;
    }
    .count-chip{
      flex:0 0 7ch;
      width:7ch;
      min-width:7ch;
      max-width:7ch;
      justify-content:center;
      text-align:center;
      font-variant-numeric:tabular-nums;
      overflow:hidden;
    }
    .pad,
    .section{
      position:relative;
      z-index:1;
      padding:22px 18px;
    }
    .eyebrow{
      color:var(--accent);
      letter-spacing:.16em;
      text-transform:uppercase;
      font-size:12px;
    }
    h1{
      margin:8px 0 0;
      font-size:34px;
      letter-spacing:.10em;
      text-transform:uppercase;
      text-shadow:0 0 18px var(--title-glow);
    }
    .hero-title{
      position:relative;
      display:inline-block;
    }
    .signal-title{
      position:relative;
      display:inline-block;
      padding:0 0 10px;
      color:var(--title-text);
      overflow:hidden;
    }
    .signal-title::before{
      content:attr(data-text);
      position:absolute;
      inset:0;
      pointer-events:none;
      color:transparent;
      background:linear-gradient(
        115deg,
        transparent 0%,
        transparent 36%,
        var(--title-sheen) 48%,
        var(--title-beam-strong) 52%,
        transparent 64%,
        transparent 100%
      );
      background-size:220% 100%;
      -webkit-background-clip:text;
      background-clip:text;
      animation:titleSweep 4.8s ease-in-out infinite;
      opacity:.95;
    }
    .signal-title::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:2px;
      border-radius:999px;
      background:
        linear-gradient(90deg, var(--title-beam-soft), var(--title-beam-strong) 50%, var(--title-beam-soft));
      box-shadow:
        0 0 0 1px var(--surface-inset),
        0 0 16px var(--title-glow);
      transform-origin:left center;
      animation:titleBeam 3.8s ease-in-out infinite;
    }
    @keyframes titleSweep{
      0%, 16%{
        background-position:160% 0;
        opacity:0;
      }
      28%{
        opacity:.98;
      }
      52%{
        background-position:30% 0;
        opacity:.9;
      }
      72%, 100%{
        background-position:-80% 0;
        opacity:0;
      }
    }
    @keyframes titleBeam{
      0%, 100%{
        transform:scaleX(.22);
        opacity:.45;
      }
      45%{
        transform:scaleX(1);
        opacity:1;
      }
      70%{
        transform:scaleX(.72);
        opacity:.7;
      }
    }
    .sub{
      margin:12px 0 0;
      max-width:80ch;
      color:var(--muted);
      line-height:1.55;
    }
    .shell-nav{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:18px;
      align-items:flex-start;
    }
    .shell-nav-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      width:148px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--surface-border-faint);
      background:var(--surface-fill);
      color:var(--fg);
      text-decoration:none;
      font-size:12px;
      white-space:nowrap;
      text-align:center;
      transition:border-color .12s ease, background .12s ease;
    }
    .shell-nav-link:hover{
      border-color:var(--accent-border);
      background:var(--surface-hover);
    }
    .shell-nav-link.active{
      border-color:var(--accent-border-soft);
      background:var(--accent-fill);
      color:var(--accent);
    }
    .hero-tools-section{
      position:relative;
      display:flex;
      align-items:center;
      min-height:60px;
      padding:10px 18px;
      border:1px solid var(--surface-border-faint);
      border-radius:18px;
      background:linear-gradient(180deg, var(--surface-hero-top), var(--surface-hero-bottom));
      box-shadow:
        0 24px 60px rgba(0,0,0,.28),
        0 0 0 1px var(--surface-inset-soft) inset;
    }
    .tool-strip{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      flex-wrap:wrap;
      width:100%;
      min-width:0;
    }
    .hero-tools{
      margin-top:0;
      width:100%;
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto;
      gap:12px;
      align-items:center;
    }
    .hero-tools-group{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      min-width:0;
    }
    .hero-tools-group--actions{justify-content:flex-start}
    .hero-tools-group--status{justify-content:flex-end}
    .hero-tools a,
    .hero-tools button,
    .hero-tools label[for]{
      cursor:pointer;
    }
    .hero-head-pad{
      min-height:156px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }
    .hero-tools .hero-tool-mark{
      appearance:none;
      position:relative;
      isolation:isolate;
      overflow:hidden;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:144px;
      min-height:32px;
      padding:0 14px;
      border:1px solid rgba(255,239,204,.12);
      border-radius:999px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,239,204,.045) 42%, rgba(255,255,255,0) 100%),
        linear-gradient(135deg, rgba(255,239,204,.12), rgba(255,255,255,0) 48%),
        var(--accent-fill-solid);
      color:var(--accent-ink);
      text-decoration:none;
      cursor:pointer;
      font-size:11px;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
      line-height:1.2;
      white-space:nowrap;
      text-align:center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05) inset,
        0 12px 28px rgba(0,0,0,.18),
        0 0 18px var(--accent-shadow);
      transition:border-color .14s ease, transform .14s ease, box-shadow .14s ease, filter .14s ease, opacity .14s ease;
    }
    .hero-tools .hero-tool-mark::before{
      content:"";
      position:absolute;
      inset:1px;
      border-radius:inherit;
      background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0));
      opacity:.28;
      pointer-events:none;
    }
    .hero-tools .hero-tool-mark:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,.16);
      filter:brightness(1.03) saturate(1.04);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.06) inset,
        0 16px 32px rgba(0,0,0,.2),
        0 0 22px var(--accent-shadow);
    }
    .hero-tools .hero-tool-mark:active{
      transform:translateY(0);
      filter:brightness(.99);
    }
    .hero-tools .hero-tool-mark:focus-visible{
      outline:none;
      border-color:rgba(255,255,255,.22);
      box-shadow:
        0 0 0 3px rgba(255,241,214,.10),
        0 0 0 1px rgba(255,255,255,.06) inset,
        0 16px 32px rgba(0,0,0,.2),
        0 0 22px var(--accent-shadow);
    }
    .hero-tools .hero-tool-mark:disabled,
    .hero-tools .hero-tool-mark[disabled],
    .hero-tools .hero-tool-mark[aria-disabled="true"]{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }
    .page-summary-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:14px;
      align-items:start;
      align-content:start;
    }
    .page-summary-grid:empty{
      display:none;
    }
    .metric{
      padding:16px;
      border:1px solid rgba(255,241,214,.10);
      border-radius:16px;
      background:rgba(0,0,0,.14);
      display:grid;
      gap:8px;
    }
    .metric b{
      font-size:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .metric .value{
      font-size:26px;
      line-height:1;
    }
    .metric .meta{
      font-size:12px;
      color:var(--muted);
    }
    .page-content-grid{
      display:grid;
      gap:16px;
      align-items:start;
      align-content:start;
    }
    .page-content-grid--equal{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      align-items:stretch;
    }
    .page-content-grid--equal > .card{
      height:100%;
    }
    .section-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }
    .section-title-wrap{
      flex:1 1 auto;
      min-width:0;
    }
    .section-title{
      margin:0;
      font-size:18px;
      letter-spacing:.03em;
      font-weight:600;
    }
    .section-tools{
      min-width:0;
      flex:0 0 auto;
    }
    .section-head .tool-strip{
      width:auto;
    }
    .search{
      min-width:180px;
      max-width:220px;
      padding:9px 12px;
      border-radius:12px;
      border:1px solid rgba(255,239,204,.12);
      background:rgba(0,0,0,.14);
      color:var(--fg);
      outline:none;
    }
    .search::placeholder{
      color:var(--muted);
    }
    .select{
      min-width:132px;
      padding:9px 12px;
      padding-right:38px;
      border-radius:12px;
      border:1px solid rgba(255,239,204,.12);
      background:rgba(0,0,0,.14);
      color:var(--fg);
      outline:none;
      line-height:1.2;
      background-image:
        linear-gradient(45deg, transparent 50%, rgba(241,234,220,.78) 50%),
        linear-gradient(135deg, rgba(241,234,220,.78) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) calc(50% - 2px),
        calc(100% - 12px) calc(50% - 2px);
      background-size:6px 6px, 6px 6px;
      background-repeat:no-repeat;
      appearance:none;
      -webkit-appearance:none;
      -moz-appearance:none;
      transition:border-color .12s ease, background .12s ease, box-shadow .12s ease, transform .12s ease;
    }
    .select:hover{
      border-color:rgba(127,183,161,.24);
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)),
        rgba(18,16,12,.88);
    }
    .select:focus{
      border-color:rgba(111,255,209,.42);
      box-shadow:
        0 0 0 3px rgba(111,255,209,.10),
        0 0 0 1px rgba(111,255,209,.08) inset,
        0 10px 24px rgba(0,0,0,.18);
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
        rgba(5,12,18,.94);
      transform:translateY(-1px);
    }
    .select option{
      color:#f1eadc;
      background:#11100c;
    }
    .filter-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:16px;
    }
    .filter-chip{
      appearance:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:14ch;
      min-width:14ch;
      max-width:14ch;
      min-height:34px;
      box-sizing:border-box;
      border:1px solid rgba(255,241,214,.10);
      background:rgba(0,0,0,.14);
      color:var(--muted);
      border-radius:999px;
      padding:7px 12px;
      font-size:12px;
      cursor:pointer;
      transition:border-color .12s ease, color .12s ease, background .12s ease;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
    }
    .filter-chip.active{
      border-color:rgba(240,160,75,.22);
      background:rgba(240,160,75,.10);
      color:var(--accent);
    }
    .filter-chip b{
      color:inherit;
      font-weight:600;
    }
    .stack{
      display:grid;
      gap:12px;
      align-content:start;
    }
    .item{
      padding:16px;
      border:1px solid rgba(255,241,214,.10);
      border-radius:14px;
      background:rgba(0,0,0,.14);
      display:grid;
      gap:10px;
    }
    .item-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .item-title{
      font-size:15px;
      font-weight:600;
      line-height:1.3;
    }
    .item-id{
      color:var(--accent2);
      font-size:12px;
      line-height:1.4;
      font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      max-width:100%;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,239,204,.045);
      border:1px solid rgba(255,241,214,.10);
      font-size:12px;
      line-height:1.35;
      color:var(--muted);
    }
    mark{
      padding:1px 4px;
      border-radius:6px;
      background:rgba(240,160,75,.16);
      color:var(--fg);
      box-shadow:0 0 0 1px rgba(240,160,75,.14) inset;
    }
    .scene{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }
    .scene span{
      display:inline-flex;
      align-items:center;
      padding:6px 10px;
      border-radius:10px;
      background:rgba(127,183,161,.10);
      color:#d8ead6;
      font-size:12px;
    }
    .empty{
      padding:20px 16px;
      border:1px dashed rgba(255,239,204,.12);
      border-radius:14px;
      color:var(--muted);
      background:rgba(0,0,0,.10);
      text-align:center;
    }
    .banner{
      position:fixed;
      top:50%;
      left:50%;
      width:min(520px, calc(100vw - 40px));
      min-width:min(320px, calc(100vw - 40px));
      padding:20px 22px;
      border-radius:22px;
      transform:translate(-50%, -50%) scale(.98);
      z-index:20;
      border:1px solid rgba(255,239,204,.12);
      background:
        radial-gradient(520px 220px at 20% 0%, rgba(240,160,75,.14), transparent 60%),
        radial-gradient(420px 200px at 100% 10%, rgba(127,183,161,.10), transparent 60%),
        rgba(18,16,12,.90);
      box-shadow:
        0 28px 80px rgba(0,0,0,.48),
        0 0 0 1px rgba(240,160,75,.08) inset;
      color:var(--fg);
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
      overflow:hidden;
    }
    .banner.show{
      opacity:1;
      transform:translate(-50%, -50%) scale(1);
    }
    .banner::before{
      content:"";
      position:absolute;
      inset:auto -12% 0 -12%;
      height:2px;
      background:linear-gradient(90deg, transparent, rgba(240,160,75,.92), rgba(127,183,161,.55), transparent);
      box-shadow:0 0 18px rgba(240,160,75,.28);
      opacity:.9;
      animation:bannerSweep 1.8s linear infinite;
    }
    .banner::after{
      content:"";
      position:absolute;
      inset:50% auto auto 50%;
      width:26px;
      height:26px;
      border-radius:999px;
      border:1px solid rgba(240,160,75,.30);
      transform:translate(-50%, -50%) scale(.24);
      opacity:0;
      pointer-events:none;
    }
    .banner.show::after{
      animation:bannerRipple .7s ease-out 1;
    }
    .banner.show:not(.err){
      animation:bannerConfirm .26s ease-out 1, bannerOkPulse 1s ease-in-out 1;
    }
    .banner.err{
      border-color:rgba(228,111,97,.22);
      background:
        radial-gradient(520px 220px at 20% 0%, rgba(228,111,97,.16), transparent 60%),
        radial-gradient(420px 200px at 100% 10%, rgba(127,183,161,.10), transparent 60%),
        rgba(20,8,14,.92);
      box-shadow:
        0 28px 80px rgba(0,0,0,.48),
        0 0 0 1px rgba(228,111,97,.10) inset;
    }
    .banner.err::after{
      border:1px solid rgba(228,111,97,.34);
    }
    .banner.err::before{
      background:linear-gradient(90deg, transparent, rgba(228,111,97,.92), rgba(127,183,161,.55), transparent);
      box-shadow:0 0 18px rgba(228,111,97,.35);
    }
    .banner.err.show{
      animation:bannerAlert .34s ease-out 1, bannerPulse 1.3s ease-in-out 2;
    }
    .banner strong{
      display:block;
      margin-bottom:10px;
      font-size:18px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .banner span{
      font-size:14px;
      line-height:1.65;
      color:var(--muted);
    }
    @keyframes bannerSweep{
      0%{transform:translateX(-28%)}
      100%{transform:translateX(28%)}
    }
    @keyframes bannerAlert{
      0%, 100%{transform:translate(-50%, -50%) scale(1)}
      20%{transform:translate(-50%, -50%) translateX(-5px) scale(1.01)}
      40%{transform:translate(-50%, -50%) translateX(5px) scale(1.01)}
      60%{transform:translate(-50%, -50%) translateX(-3px) scale(1)}
      80%{transform:translate(-50%, -50%) translateX(3px) scale(1)}
    }
    @keyframes bannerConfirm{
      0%{transform:translate(-50%, -50%) scale(.975)}
      55%{transform:translate(-50%, -50%) scale(1.01)}
      100%{transform:translate(-50%, -50%) scale(1)}
    }
    @keyframes bannerPulse{
      0%, 100%{
        box-shadow:
          0 28px 80px rgba(0,0,0,.48),
          0 0 0 1px rgba(228,111,97,.10) inset;
      }
      50%{
        box-shadow:
          0 28px 80px rgba(0,0,0,.48),
          0 0 0 1px rgba(228,111,97,.16) inset,
          0 0 28px rgba(228,111,97,.14);
      }
    }
    @keyframes bannerOkPulse{
      0%, 100%{
        box-shadow:
          0 28px 80px rgba(0,0,0,.48),
          0 0 0 1px rgba(240,160,75,.08) inset;
      }
      50%{
        box-shadow:
          0 28px 80px rgba(0,0,0,.48),
          0 0 0 1px rgba(240,160,75,.14) inset,
          0 0 26px rgba(240,160,75,.12);
      }
    }
    @keyframes bannerRipple{
      0%{
        opacity:.4;
        transform:translate(-50%, -50%) scale(.24);
      }
      100%{
        opacity:0;
        transform:translate(-50%, -50%) scale(16);
      }
    }
    .page-footer-slot{
      padding:20px 0 24px;
    }
    .shell-footer{
      margin:0;
      text-align:center;
      color:var(--footer-fg);
      font-size:12px;
    }
    @media (max-width: 980px){
      .hero-tools{grid-template-columns:1fr}
      .hero-tools-group--status{justify-content:flex-start}
      .page-summary-grid,
      .page-content-grid--equal{
        grid-template-columns:1fr;
      }
      .section-head{
        flex-direction:column;
        align-items:stretch;
      }
      .search,
      .select{
        max-width:none;
      }
    }
    @media (prefers-reduced-motion: reduce){
      .signal-title::before,
      .signal-title::after,
      .banner.err,
      .banner.err::before,
      .banner.err::after{
        animation:none;
      }
      .signal-title::before{opacity:0}
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="banner" id="banner" aria-live="polite" aria-atomic="true"></div>
  <main class="wrap">
    <section class="card">
      <div class="bar">
        <div class="bar-start">
          <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>
        <div class="bar-end">
          <div class="chip">workspace</div>
        </div>
      </div>
      <div class="pad hero-head-pad">
        <div class="eyebrow">Helix</div>
        <h1><span class="hero-title signal-title" data-text="Runtime Board">Runtime Board</span></h1>
        <p class="sub">查看当前任务、会话和结果概览。</p>
        <div id="page-nav"></div>
      </div>
    </section>

    <section class="hero-tools-section">
      <div class="hero-tools">
        <div class="hero-tools-group hero-tools-group--actions">
          <button class="hero-tool-mark" type="button" id="refresh-idle">Refresh</button>
        </div>
        <div class="hero-tools-group hero-tools-group--status">
          <div class="chip status-chip" id="refresh-time">sync pending</div>
          <label class="chip" for="auto-refresh">
            <input id="auto-refresh" type="checkbox" checked />
            <span>auto sync</span>
          </label>
        </div>
      </div>
    </section>

    <section class="page-summary-grid" id="overview"></section>

    <section class="page-content-grid page-content-grid--equal">
      <section class="card main-panel-card">
        <div class="bar">
          <div class="bar-start">
            <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="chip">runtime jobs</div>
          </div>
          <div class="bar-end">
            <div class="chip count-chip" id="jobs-count">0/0</div>
          </div>
        </div>
        <div class="section">
          <div class="section-head">
            <div class="section-title-wrap">
              <h2 class="section-title">Active Jobs</h2>
            </div>
            <div class="section-tools tool-strip">
              <input class="search" id="jobs-search" type="search" placeholder="Search jobs" />
              <select class="select" id="jobs-sort">
                <option value="age-desc">Oldest first</option>
                <option value="age-asc">Newest first</option>
                <option value="name-asc">Name A-Z</option>
              </select>
            </div>
          </div>
          <div class="filter-row" id="jobs-chips"></div>
          <div class="stack" id="jobs-list"></div>
        </div>
      </section>

      <section class="card main-panel-card">
        <div class="bar">
          <div class="bar-start">
            <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="chip">runtime sessions</div>
          </div>
          <div class="bar-end">
            <div class="chip count-chip" id="sessions-count">0/0</div>
          </div>
        </div>
        <div class="section">
          <div class="section-head">
            <div class="section-title-wrap">
              <h2 class="section-title">Runtime Sessions</h2>
            </div>
            <div class="section-tools tool-strip">
              <input class="search" id="sessions-search" type="search" placeholder="Search sessions" />
              <select class="select" id="sessions-sort">
                <option value="age-desc">Oldest first</option>
                <option value="age-asc">Newest first</option>
                <option value="key-asc">Key A-Z</option>
              </select>
            </div>
          </div>
          <div class="filter-row" id="sessions-chips"></div>
          <div class="stack" id="sessions-list"></div>
        </div>
      </section>

      <section class="card main-panel-card">
        <div class="bar">
          <div class="bar-start">
            <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="chip">app context videos</div>
          </div>
          <div class="bar-end">
            <div class="chip">snapshot</div>
          </div>
        </div>
        <div class="section">
          <div class="section-head">
            <div class="section-title-wrap">
              <h2 class="section-title">Video Snapshot</h2>
            </div>
            <div class="section-tools tool-strip">
              <input class="search" id="video-search" type="search" placeholder="Search videos" />
            </div>
          </div>
          <div class="stack" id="video-list"></div>
        </div>
      </section>

      <section class="card main-panel-card">
        <div class="bar">
          <div class="bar-start">
            <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="chip">app context reports</div>
          </div>
          <div class="bar-end">
            <div class="chip">snapshot</div>
          </div>
        </div>
        <div class="section">
          <div class="section-head">
            <div class="section-title-wrap">
              <h2 class="section-title">Report Snapshots</h2>
            </div>
            <div class="section-tools tool-strip">
              <input class="search" id="reports-search" type="search" placeholder="Search reports" />
            </div>
          </div>
          <div class="stack" id="reports-list"></div>
        </div>
      </section>
    </section>

    <div class="page-footer-slot" id="page-footer"></div>
  </main>

  <script>
    function escapeHtml(value){
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function mountNav(targetId, nav, activeHref){
      const root = document.getElementById(targetId);
      if(!root) return;
      root.innerHTML = `
        <nav class="shell-nav" aria-label="workspace">
          ${nav.map((item) => `
            <a class="shell-nav-link${item.href === activeHref ? " active" : ""}" href="${item.href}">
              <span>${escapeHtml(item.title)}</span>
            </a>
          `).join("")}
        </nav>
      `;
    }

    function mountFooter(targetId, text){
      const root = document.getElementById(targetId);
      if(!root) return;
      root.innerHTML = `<div class="shell-footer">${escapeHtml(text)}</div>`;
    }

    function shellMessage(kind){
      const dict = {
        synced: ["Synced", "Runtime updated."],
        sync_failed: ["Sync Failed", "Unable to update runtime."],
        load_failed: ["Load Failed", "Unable to load runtime data."]
      };
      return dict[kind] || ["Notice", ""];
    }

    mountNav("page-nav", [
      {title: "Workspace", href: "/", tag: "home"},
      {title: "Logs", href: "/logs", tag: "logs"},
      {title: "Runtime", href: "/idle", tag: "runtime"}
    ], "/idle");
    mountFooter("page-footer", "HELIX · workspace · v__APP_VERSION__");

    const overviewHost = document.getElementById("overview");
    const jobsHost = document.getElementById("jobs-list");
    const sessionsHost = document.getElementById("sessions-list");
    const videoHost = document.getElementById("video-list");
    const reportsHost = document.getElementById("reports-list");
    const banner = document.getElementById("banner");
    const jobsSearch = document.getElementById("jobs-search");
    const sessionsSearch = document.getElementById("sessions-search");
    const videoSearch = document.getElementById("video-search");
    const reportsSearch = document.getElementById("reports-search");
    const refreshButton = document.getElementById("refresh-idle");
    const refreshTime = document.getElementById("refresh-time");
    const autoRefresh = document.getElementById("auto-refresh");
    const jobsChips = document.getElementById("jobs-chips");
    const sessionsChips = document.getElementById("sessions-chips");
    const jobsSort = document.getElementById("jobs-sort");
    const sessionsSort = document.getElementById("sessions-sort");
    const previewMode = location.protocol === "file:";
    let idleData = null;
    let refreshTimer = null;
    let refreshTask = null;
    const qs = new URLSearchParams(location.search);
    let jobsScope = qs.get("jobs_scope") || "all";
    let sessionsScope = qs.get("sessions_scope") || "all";
    const previewIdleData = {
      active_runtime_jobs : 1,
      active_sessions     : 1,
      active_total        : 2,
      idle_sec            : 18.4,
      ttl_sec             : 1800.0,
      jobs                : [
        {id: "job-preview-01", name: "nexus.plan", age_sec: 18.4}
      ],
      sessions            : {
        "sess-preview-01": {job_id: "job-preview-01", name: "runtime.preview", age_sec: 12.1}
      },
      instance            : {
        video_list        : {fp: "preview", count: 2, head: [{parent: "shots", name: "frame_001.png"}], parent_stats: [{parent: "shots", count: 2}]},
        fx_report_session : {fp: "preview", count: 1, head: [{id: "fx-01", parent: "reports", name: "fx_head.json"}], parent_stats: [{parent: "reports", count: 1}], tail: []},
        mx_report_session : {fp: "preview", count: 1, head: [{id: "mx-01", item: {type: "scene", n: 1, scene: ["preview lane"], repr: "preview summary"}}], tail: []}
      }
    };
    function fmtSec(v){
      const n = Number(v || 0);
      if (!Number.isFinite(n)) return "0.0s";
      if (n < 60) return `${n.toFixed(1)}s`;
      const m = Math.floor(n / 60);
      const s = Math.floor(n % 60);
      return `${m}m ${s}s`;
    }

    function fmtClock(date){
      return date.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
    }

    function showBanner(title, detail, kind = ""){
      banner.className = kind ? `banner ${kind}` : "banner";
      banner.innerHTML = `<strong>${title}</strong><span>${detail}</span>`;
      banner.classList.add("show");
      clearTimeout(showBanner.timer);
      showBanner.timer = setTimeout(() => banner.classList.remove("show"), 1800);
    }

    function renderOverview(data){
      const jobs = Array.isArray(data.jobs) ? data.jobs : [];
      const sessions = data.sessions && typeof data.sessions === "object" ? Object.keys(data.sessions) : [];
      const runtimeJobs = typeof data.active_runtime_jobs === "number" ? data.active_runtime_jobs : jobs.length;
      const activeTotal = typeof data.active_total === "number" ? data.active_total : runtimeJobs + sessions.length;
      overviewHost.innerHTML = `
        <div class="metric">
          <b>Active Jobs</b>
          <div class="value">${runtimeJobs}</div>
          <div class="meta">${jobs.length} cards rendered · total ${activeTotal}</div>
        </div>
        <div class="metric">
          <b>Idle Time</b>
          <div class="value">${fmtSec(data.idle_sec)}</div>
          <div class="meta">ttl ${fmtSec(data.ttl_sec)}</div>
        </div>
        <div class="metric">
          <b>Sessions</b>
          <div class="value">${sessions.length}</div>
          <div class="meta">stable runtime handles</div>
        </div>
        <div class="metric">
          <b>App Context</b>
          <div class="value">${Object.keys(data.instance || {}).length}</div>
          <div class="meta">snapshot groups</div>
        </div>
      `;
    }

    function sortByAge(items){
      return [...items].sort((a, b) => Number(b.age_sec || 0) - Number(a.age_sec || 0));
    }

    function sortByAgeAsc(items){
      return [...items].sort((a, b) => Number(a.age_sec || 0) - Number(b.age_sec || 0));
    }

    function sortByName(items, key = "name"){
      return [...items].sort((a, b) => searchText(a[key]).localeCompare(searchText(b[key])));
    }

    function searchText(value){
      return String(value || "").toLowerCase();
    }

    function escapeHtml(value){
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeRegExp(value){
      return String(value || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightText(value, query){
      const raw = String(value || "");
      if(!query) return escapeHtml(raw);
      const re = new RegExp(`(${escapeRegExp(query)})`, "ig");
      return escapeHtml(raw).replace(re, "<mark>$1</mark>");
    }

    function matchesQuery(parts, query){
      if(!query) return true;
      return parts.some((part) => searchText(part).includes(query));
    }

    function applySort(items, mode, nameKey){
      if(mode === "age-asc") return sortByAgeAsc(items);
      if(mode === "name-asc" || mode === "key-asc") return sortByName(items, nameKey);
      return sortByAge(items);
    }

    function categoryOf(name){
      const raw = String(name || "").trim();
      if(!raw) return "uncategorized";
      const text = raw.toLowerCase();
      if(text.startsWith("device.") || text.includes("phone") || text.includes("widget")) return "device";
      if(text.startsWith("media.") || text.includes("video") || text.includes("ffmpeg") || text.includes("player")) return "media";
      if(text.startsWith("bench.") || text.includes("bench")) return "bench";
      if(text.startsWith("nexus.") || text.includes("nexus")) return "nexus";
      if(text.startsWith("ui.") || text.includes("scroll") || text.includes("tap")) return "ui";
      if(text.startsWith("memrix.") || text.includes("memrix")) return "memrix";
      if(text.startsWith("framix.") || text.includes("framix")) return "framix";
      if(text.startsWith("idle.") || text.includes("idle")) return "idle";
      const head = raw.split(".")[0].split(":")[0].split("/")[0].trim().toLowerCase();
      return head || "uncategorized";
    }

    function renderScopeChips(host, items, selected, onSelect, keyName){
      const counts = items.reduce((acc, item) => {
        const cat = categoryOf(item[keyName]);
        acc[cat] = (acc[cat] || 0) + 1;
        return acc;
      }, {});
      const cats = Object.keys(counts).sort();
      const all = ["all", ...cats];
      host.innerHTML = all.map((cat) => `
        <button class="filter-chip${cat === selected ? " active" : ""}" type="button" data-scope="${cat}">
          <span>${cat}</span>
          <b>${cat === "all" ? items.length : counts[cat]}</b>
        </button>
      `).join("");
      host.onclick = (event) => {
        const button = event.target.closest("button[data-scope]");
        if(!button) return;
        onSelect(button.getAttribute("data-scope") || "all");
      };
    }

    function applyScope(items, scope, keyName){
      if(scope === "all") return items;
      return items.filter((item) => categoryOf(item[keyName]) === scope);
    }

    function syncQuery(){
      const next = new URLSearchParams();
      if (jobsScope !== "all") next.set("jobs_scope", jobsScope);
      if (sessionsScope !== "all") next.set("sessions_scope", sessionsScope);
      if (jobsSearch.value.trim()) next.set("jobs_q", jobsSearch.value.trim());
      if (sessionsSearch.value.trim()) next.set("sessions_q", sessionsSearch.value.trim());
      if (jobsSort.value !== "age-desc") next.set("jobs_sort", jobsSort.value);
      if (sessionsSort.value !== "age-desc") next.set("sessions_sort", sessionsSort.value);
      const query = next.toString();
      history.replaceState(null, "", query ? `${location.pathname}?${query}` : location.pathname);
    }

    function setRefreshStamp(text){
      refreshTime.textContent = text;
    }

    function setRefreshPending(pending){
      refreshButton.disabled = pending;
      refreshButton.setAttribute("aria-busy", pending ? "true" : "false");
    }

    function renderJobs(data){
      const query = searchText(jobsSearch.value).trim();
      const baseJobs = Array.isArray(data.jobs) ? data.jobs : [];
      renderScopeChips(jobsChips, baseJobs, jobsScope, (scope) => {
        jobsScope = scope;
        rerenderFilters();
      }, "name");
      const allJobs = applySort(applyScope(baseJobs, jobsScope, "name"), jobsSort.value, "name");
      const jobs = allJobs.filter((job) => matchesQuery([
        job.id,
        job.name
      ], query));
      document.getElementById("jobs-count").textContent = `${jobs.length}/${allJobs.length}`;
      jobsHost.innerHTML = jobs.length ? jobs.map((job) => `
        <div class="item">
          <div class="item-head">
            <div>
              <div class="item-title">${highlightText(job.name || "unnamed job", query)}</div>
              <div class="item-id">${highlightText(job.id || "-", query)}</div>
            </div>
            <div class="pill">${fmtSec(job.age_sec)}</div>
          </div>
        </div>
      `).join("") : `<div class="empty">${allJobs.length ? "No jobs match current search." : "No active jobs."}</div>`;
    }

    function renderSessions(data){
      const query = searchText(sessionsSearch.value).trim();
      const allSessionsBase = data.sessions && typeof data.sessions === "object"
        ? Object.entries(data.sessions).map(([key, value]) => ({key, ...(value || {})}))
        : [];
      renderScopeChips(sessionsChips, allSessionsBase, sessionsScope, (scope) => {
        sessionsScope = scope;
        rerenderFilters();
      }, "name");
      const allSessions = applySort(
        applyScope(allSessionsBase, sessionsScope, "name"),
        sessionsSort.value,
        "key"
      );
      const sessions = allSessions.filter((value) => matchesQuery([
        value.key,
        value.job_id,
        value.name
      ], query));
      document.getElementById("sessions-count").textContent = `${sessions.length}/${allSessions.length}`;
      sessionsHost.innerHTML = sessions.length ? sessions.map((value) => `
        <div class="item">
          <div class="item-head">
            <div>
              <div class="item-title">${highlightText(value.key, query)}</div>
              <div class="item-id">${highlightText(value.job_id || "-", query)}</div>
            </div>
            <div class="pill">${fmtSec(value.age_sec)}</div>
          </div>
          <div class="pill">${highlightText(value.name || "unknown session", query)}</div>
        </div>
      `).join("") : `<div class="empty">${allSessions.length ? "No sessions match current search." : "No mapped sessions."}</div>`;
    }

    function renderScene(scene){
      return Array.isArray(scene) && scene.length
        ? `<div class="scene">${scene.map((item) => `<span>${item}</span>`).join("")}</div>`
        : `<div class="pill">scene: empty</div>`;
    }

    function renderSummaryItem(item, query = ""){
      const scene = Array.isArray((item.item || {}).scene) ? (item.item || {}).scene : [];
      const type = (item.item || {}).type || "unknown";
      const n = (item.item || {}).n;
      const repr = (item.item || {}).repr;
      return `
        <div class="item">
          <div class="item-head">
            <div>
              <div class="item-title">${highlightText(item.id, query)}</div>
              <div class="item-id">${highlightText(type, query)}</div>
            </div>
            ${n !== undefined ? `<div class="pill">n ${n}</div>` : `<div class="pill">scene ${scene.length}</div>`}
          </div>
          ${scene.length ? renderScene(scene.map((one) => highlightText(one, query))) : ""}
          ${repr ? `<div class="pill">${highlightText(repr, query)}</div>` : ""}
        </div>
      `;
    }

    function renderVideo(instance){
      const query = searchText(videoSearch.value).trim();
      const video = (instance || {}).video_list || {};
      const rows = [];
      if (Array.isArray(video.head) && video.head.length){
        const headItems = video.head.map((item) => `${item.parent}/${item.name}`).filter((item) => matchesQuery([item], query));
        if (headItems.length){
        rows.push(`
          <div class="item">
            <div class="item-head">
              <div class="item-title">Head</div>
              <div class="pill">${video.count || 0} files</div>
            </div>
            ${renderScene(headItems.map((item) => highlightText(item, query)))}
          </div>
        `);
        }
      }
      if (Array.isArray(video.parent_stats) && video.parent_stats.length){
        const parentItems = video.parent_stats.map((item) => `${item.parent}:${item.count}`).filter((item) => matchesQuery([item], query));
        if (parentItems.length){
        rows.push(`
          <div class="item">
            <div class="item-head">
              <div class="item-title">Parent Stats</div>
              <div class="pill">top folders</div>
            </div>
            ${renderScene(parentItems.map((item) => highlightText(item, query)))}
          </div>
        `);
        }
      }
      videoHost.innerHTML = rows.length ? rows.join("") : `<div class="empty">${query ? "No video items match current search." : "No video snapshot yet."}</div>`;
    }

    function renderReports(instance){
      const query = searchText(reportsSearch.value).trim();
      const fx = (instance || {}).fx_report_session || {};
      const mx = (instance || {}).mx_report_session || {};
      const cards = [];
      if (Array.isArray(fx.head) && fx.head.length){
        const fxHead = fx.head.map((item) => `${item.id}:${item.parent}/${item.name}`).filter((item) => matchesQuery([item], query));
        if (fxHead.length){
        cards.push(`
          <div class="item">
            <div class="item-head">
              <div class="item-title">FX Report Session</div>
              <div class="pill">${fx.fp || "fp"}</div>
            </div>
            ${renderScene(fxHead.map((item) => highlightText(item, query)))}
          </div>
        `);
        }
      }
      if (Array.isArray(fx.parent_stats) && fx.parent_stats.length){
        const fxParents = fx.parent_stats.map((item) => `${item.parent}:${item.count}`).filter((item) => matchesQuery([item], query));
        if (fxParents.length){
        cards.push(`
          <div class="item">
            <div class="item-head">
              <div class="item-title">FX Parent Stats</div>
              <div class="pill">folders</div>
            </div>
            ${renderScene(fxParents.map((item) => highlightText(item, query)))}
          </div>
        `);
        }
      }
      if (Array.isArray(fx.tail) && fx.tail.length){
        const fxTail = fx.tail.map((item) => `${item.id}:${item.parent}/${item.name}`).filter((item) => matchesQuery([item], query));
        if (fxTail.length){
        cards.push(`
          <div class="item">
            <div class="item-head">
              <div class="item-title">FX Tail</div>
              <div class="pill">${fx.tail.length}</div>
            </div>
            ${renderScene(fxTail.map((item) => highlightText(item, query)))}
          </div>
        `);
        }
      }
      if (Array.isArray(mx.head) && mx.head.length){
        const mxHead = mx.head.filter((item) => matchesQuery([
          item.id,
          (item.item || {}).type,
          ((item.item || {}).scene || []).join(" "),
          (item.item || {}).repr
        ], query));
        if (mxHead.length){
        cards.push(`
          <div class="item">
            <div class="item-head">
              <div class="item-title">MX Report Session</div>
              <div class="pill">${mx.fp || "fp"}</div>
            </div>
            <div class="stack">
              ${mxHead.map((item) => renderSummaryItem(item, query)).join("")}
            </div>
          </div>
        `);
        }
      }
      if (Array.isArray(mx.tail) && mx.tail.length){
        const mxTail = mx.tail.filter((item) => matchesQuery([
          item.id,
          (item.item || {}).type,
          ((item.item || {}).scene || []).join(" "),
          (item.item || {}).repr
        ], query));
        if (mxTail.length){
        cards.push(`
          <div class="item">
            <div class="item-head">
              <div class="item-title">MX Tail</div>
              <div class="pill">${mx.tail.length}</div>
            </div>
            <div class="stack">
              ${mxTail.map((item) => renderSummaryItem(item, query)).join("")}
            </div>
          </div>
        `);
        }
      }
      reportsHost.innerHTML = cards.length ? cards.join("") : `<div class="empty">${query ? "No report items match current search." : "No app context reports yet."}</div>`;
    }

    async function loadIdle(options = {}){
      const {silent = false} = options;
      if(refreshTask) return refreshTask;
      refreshTask = (async () => {
        if(previewMode){
          idleData = previewIdleData;
          renderOverview(idleData);
          renderJobs(idleData);
          renderSessions(idleData);
          renderVideo(idleData.instance || {});
          renderReports(idleData.instance || {});
          setRefreshStamp("preview mode");
          return;
        }
        setRefreshPending(true);
        setRefreshStamp("syncing");
        try{
          const resp = await fetch("/api/idle", {cache: "no-store"});
          if(!resp.ok) throw new Error("idle load failed");
          idleData = await resp.json();
          renderOverview(idleData);
          renderJobs(idleData);
          renderSessions(idleData);
          renderVideo(idleData.instance || {});
          renderReports(idleData.instance || {});
          setRefreshStamp(`updated ${fmtClock(new Date())}`);
          if(!silent){
            const [title] = shellMessage("synced");
            showBanner(title, "Runtime updated.", "");
          }
        }catch(err){
          setRefreshStamp("sync failed");
          throw err;
        }finally{
          setRefreshPending(false);
          refreshTask = null;
        }
      })();
      return refreshTask;
    }

    function rerenderFilters(){
      if(!idleData) return;
      syncQuery();
      renderJobs(idleData);
      renderSessions(idleData);
    }

    function scheduleRefresh(){
      if(refreshTimer){
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
      if(previewMode){
        setRefreshStamp("preview mode");
        return;
      }
      if(!autoRefresh.checked) return;
      refreshTimer = setInterval(() => {
        loadIdle({silent: true}).catch(() => {
          const [title] = shellMessage("sync_failed");
          showBanner(title, "Unable to update runtime.", "err");
        });
      }, 12000);
    }

    if (qs.get("jobs_q")) jobsSearch.value = qs.get("jobs_q");
    if (qs.get("sessions_q")) sessionsSearch.value = qs.get("sessions_q");
    if (qs.get("jobs_sort")) jobsSort.value = qs.get("jobs_sort");
    if (qs.get("sessions_sort")) sessionsSort.value = qs.get("sessions_sort");

    jobsSearch.addEventListener("input", rerenderFilters);
    sessionsSearch.addEventListener("input", rerenderFilters);
    jobsSort.addEventListener("change", rerenderFilters);
    sessionsSort.addEventListener("change", rerenderFilters);
    videoSearch.addEventListener("input", () => {
      if(!idleData) return;
      renderVideo(idleData.instance || {});
    });
    reportsSearch.addEventListener("input", () => {
      if(!idleData) return;
      renderReports(idleData.instance || {});
    });
    refreshButton.addEventListener("click", () => {
      loadIdle().catch(() => {
        const [title] = shellMessage("sync_failed");
        showBanner(title, "Unable to update runtime.", "err");
      });
    });
    autoRefresh.addEventListener("change", scheduleRefresh);
    loadIdle().catch(() => {
      const [title] = shellMessage("load_failed");
      showBanner(title, "Unable to load runtime data.", "err");
      overviewHost.innerHTML = "";
      jobsHost.innerHTML = `<div class="empty">Unable to load jobs.</div>`;
      sessionsHost.innerHTML = `<div class="empty">Unable to load sessions.</div>`;
      videoHost.innerHTML = `<div class="empty">Unable to load video snapshot.</div>`;
      reportsHost.innerHTML = `<div class="empty">Unable to load report snapshots.</div>`;
    });
    scheduleRefresh();
  </script>
</body>
</html>
