<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Helix Logs</title>
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="shortcut icon" href="/static/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Helix" />
  <link rel="manifest" href="/static/site.webmanifest" />
  <style>
    :root{
      --bg:#05060a;
      --fg:#d7f7ff;
      --muted:#89a3ad;
      --line:rgba(255,255,255,.08);
      --accent:#5cffd6;
      --accent2:#7aa7ff;
      --ok:#5cff7a;
      --warn:#ffd27a;
      --danger:#ff5c9a;
      --shadow:0 30px 90px rgba(0,0,0,.65);
      --surface-top:rgba(255,255,255,.06);
      --surface-bottom:rgba(255,255,255,.03);
      --surface-hero-top:rgba(255,255,255,.05);
      --surface-hero-bottom:rgba(255,255,255,.02);
      --surface-inset:rgba(92,255,214,.06);
      --surface-inset-soft:rgba(92,255,214,.04);
      --surface-border-soft:rgba(255,255,255,.10);
      --surface-border-faint:rgba(255,255,255,.08);
      --surface-fill:rgba(0,0,0,.16);
      --surface-fill-soft:rgba(0,0,0,.14);
      --surface-fill-strong:rgba(0,0,0,.18);
      --surface-hover:rgba(255,255,255,.04);
      --accent-fill:rgba(92,255,214,.08);
      --accent-fill-strong:rgba(92,255,214,.10);
      --accent-fill-solid:rgba(92,255,214,.9);
      --accent-border:rgba(92,255,214,.32);
      --accent-border-soft:rgba(92,255,214,.18);
      --accent-ink:rgba(0,0,0,.85);
      --accent-shadow:rgba(92,255,214,.25);
      --accent2-fill:rgba(122,167,255,.10);
      --accent2-fill-strong:rgba(122,167,255,.14);
      --danger-fill:rgba(255,92,154,.10);
      --danger-fill-strong:rgba(255,92,154,.16);
      --title-text:rgba(215,247,255,.96);
      --title-sheen:rgba(255,255,255,.92);
      --title-glow:rgba(92,255,214,.22);
      --title-beam-soft:rgba(122,167,255,.18);
      --title-beam-strong:rgba(92,255,214,.88);
      --grid-line:rgba(255,255,255,.04);
      --dot-danger:#ff6f98;
      --dot-warn:#ffc86f;
      --dot-ok:#6fffd1;
      --footer-fg:rgba(137,163,173,.85);
    }
    *{box-sizing:border-box}
    html{
      min-height:100%;
      overflow-y:scroll;
      scrollbar-gutter:stable;
      scrollbar-width:thin;
      scrollbar-color:rgba(255,255,255,.14) transparent;
    }
    html::-webkit-scrollbar{
      width:8px;
      height:8px;
    }
    html::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.14);
      border-radius:999px;
    }
    html::-webkit-scrollbar-track{
      background:transparent;
    }
    body{min-height:100%}
    body{
      margin:0;
      color:var(--fg);
      background:
        radial-gradient(900px 540px at 18% 8%, var(--accent2-fill), transparent 58%),
        radial-gradient(760px 480px at 82% 14%, var(--accent-fill), transparent 60%),
        #05060a;
      font:14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }
    .grid{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.22;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size:44px 44px;
      mask-image:radial-gradient(800px 520px at 50% 15%, #000 42%, transparent 82%);
    }
    .wrap{
      width:90%;
      margin:28px auto 40px;
      display:grid;
      gap:16px;
    }
    .card{
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(180deg, var(--surface-top), var(--surface-bottom));
      box-shadow:
        var(--shadow),
        0 0 0 1px var(--surface-inset) inset;
      overflow:hidden;
      position:relative;
      backdrop-filter:blur(10px);
    }
    .main-panel-card{
      min-height:320px;
      display:flex;
      flex-direction:column;
    }
    .main-panel-card > .pad,
    .main-panel-card > .section{
      flex:1 1 auto;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(700px 260px at 20% 0%, var(--accent-fill), transparent 56%),
        radial-gradient(700px 240px at 100% 0%, var(--accent2-fill), transparent 58%);
    }
    .bar{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 18px;
      min-height:52px;
      border-bottom:1px solid var(--surface-border-faint);
      background:var(--surface-fill);
      box-sizing:border-box;
    }
    .bar-start,
    .bar-end{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .bar-start{flex-wrap:nowrap}
    .bar-end{
      flex:0 0 auto;
      justify-content:flex-end;
      flex-wrap:wrap;
    }
    .dots{display:flex; gap:8px}
    .dots i{display:block; width:10px; height:10px; border-radius:999px}
    .dots i:nth-child(1){background:var(--dot-danger)}
    .dots i:nth-child(2){background:var(--dot-warn)}
    .dots i:nth-child(3){background:var(--dot-ok)}
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--surface-border-soft);
      background:var(--surface-fill);
      white-space:nowrap;
    }
    .pad,
    .section{
      position:relative;
      z-index:1;
      padding:22px 18px;
    }
    .eyebrow{
      color:var(--accent);
      letter-spacing:.16em;
      text-transform:uppercase;
      font-size:12px;
    }
    h1{
      margin:8px 0 0;
      font-size:34px;
      letter-spacing:.10em;
      text-transform:uppercase;
      text-shadow:0 0 18px var(--title-glow);
    }
    .hero-title{
      position:relative;
      display:inline-block;
    }
    .signal-title{
      position:relative;
      display:inline-block;
      padding:0 0 10px;
      color:var(--title-text);
      overflow:hidden;
    }
    .signal-title::before{
      content:attr(data-text);
      position:absolute;
      inset:0;
      pointer-events:none;
      color:transparent;
      background:linear-gradient(
        115deg,
        transparent 0%,
        transparent 36%,
        var(--title-sheen) 48%,
        var(--title-beam-strong) 52%,
        transparent 64%,
        transparent 100%
      );
      background-size:220% 100%;
      -webkit-background-clip:text;
      background-clip:text;
      animation:titleSweep 4.8s ease-in-out infinite;
      opacity:.95;
    }
    .signal-title::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:2px;
      border-radius:999px;
      background:linear-gradient(90deg, var(--title-beam-soft), var(--title-beam-strong) 50%, var(--title-beam-soft));
      box-shadow:0 0 0 1px var(--surface-inset), 0 0 16px var(--title-glow);
      transform-origin:left center;
      animation:titleBeam 3.8s ease-in-out infinite;
    }
    @keyframes titleSweep{
      0%, 16%{background-position:160% 0; opacity:0}
      28%{opacity:.98}
      52%{background-position:30% 0; opacity:.9}
      72%, 100%{background-position:-80% 0; opacity:0}
    }
    @keyframes titleBeam{
      0%, 100%{transform:scaleX(.22); opacity:.45}
      45%{transform:scaleX(1); opacity:1}
      70%{transform:scaleX(.72); opacity:.7}
    }
    .sub{
      margin:12px 0 0;
      max-width:80ch;
      color:var(--muted);
      line-height:1.55;
    }
    .shell-nav{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:18px;
      align-items:flex-start;
    }
    .shell-nav-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      width:148px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--surface-border-faint);
      background:var(--surface-fill);
      color:var(--fg);
      text-decoration:none;
      font-size:12px;
      white-space:nowrap;
      text-align:center;
      transition:border-color .12s ease, background .12s ease;
    }
    .shell-nav-link:hover{
      border-color:var(--accent-border);
      background:var(--surface-hover);
    }
    .shell-nav-link.active{
      border-color:var(--accent-border-soft);
      background:var(--accent-fill);
      color:var(--accent);
    }
    .hero-tools-section{
      position:relative;
      display:flex;
      align-items:center;
      min-height:60px;
      padding:10px 18px;
      border:1px solid var(--surface-border-faint);
      border-radius:18px;
      background:linear-gradient(180deg, var(--surface-hero-top), var(--surface-hero-bottom));
      box-shadow:
        0 24px 60px rgba(0,0,0,.28),
        0 0 0 1px var(--surface-inset-soft) inset;
    }
    .tool-strip{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      flex-wrap:wrap;
      width:100%;
      min-width:0;
    }
    .hero-tools{margin-top:0}
    .hero-tools a,
    .hero-tools button,
    .hero-tools label[for]{
      cursor:pointer;
    }
    .hero-head-pad{
      min-height:156px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }
    .hero-tools .hero-tool-mark{
      appearance:none;
      position:relative;
      isolation:isolate;
      overflow:hidden;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:144px;
      min-height:32px;
      padding:0 14px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:999px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 42%, rgba(255,255,255,0) 100%),
        linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,0) 48%),
        var(--accent-fill-solid);
      color:var(--accent-ink);
      text-decoration:none;
      cursor:pointer;
      font-size:11px;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
      line-height:1.2;
      white-space:nowrap;
      text-align:center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05) inset,
        0 12px 28px rgba(0,0,0,.18),
        0 0 18px var(--accent-shadow);
      transition:border-color .14s ease, transform .14s ease, box-shadow .14s ease, filter .14s ease, opacity .14s ease;
    }
    .hero-tools .hero-tool-mark::before{
      content:"";
      position:absolute;
      inset:1px;
      border-radius:inherit;
      background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0));
      opacity:.28;
      pointer-events:none;
    }
    .search{
      min-width:220px;
      max-width:320px;
      padding:9px 12px;
      border-radius:12px;
      border:1px solid var(--surface-border-soft);
      background:var(--surface-fill-soft);
      color:var(--fg);
      outline:none;
    }
    .search::placeholder{color:var(--muted)}
    .hero-tools .hero-tool-mark:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,.16);
      filter:brightness(1.03) saturate(1.04);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.06) inset,
        0 16px 32px rgba(0,0,0,.2),
        0 0 22px var(--accent-shadow);
    }
    .hero-tools .hero-tool-mark:active{
      transform:translateY(0);
      filter:brightness(.99);
    }
    .hero-tools .hero-tool-mark:focus-visible{
      outline:none;
      border-color:rgba(255,255,255,.22);
      box-shadow:
        0 0 0 3px rgba(255,255,255,.08),
        0 0 0 1px rgba(255,255,255,.06) inset,
        0 16px 32px rgba(0,0,0,.2),
        0 0 22px var(--accent-shadow);
    }
    .hero-tools .hero-tool-mark:disabled,
    .hero-tools .hero-tool-mark[disabled],
    .hero-tools .hero-tool-mark[aria-disabled="true"]{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }
    .page-summary-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:14px;
      align-items:start;
      align-content:start;
    }
    .page-content-grid{
      display:grid;
      gap:16px;
      align-items:start;
      align-content:start;
    }
    .metric{
      padding:16px;
      border:1px solid var(--surface-border-faint);
      border-radius:16px;
      background:var(--surface-fill-soft);
      display:grid;
      gap:8px;
    }
    .metric b{
      font-size:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .metric .value{
      font-size:26px;
      line-height:1;
    }
    .metric .meta{
      font-size:12px;
      color:var(--muted);
      word-break:break-all;
    }
    .section-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }
    .section-title-wrap{
      flex:1 1 auto;
      min-width:0;
    }
    .section-title{
      margin:0;
      font-size:18px;
      letter-spacing:.03em;
      font-weight:600;
    }
    .section-tools{
      min-width:0;
      flex:0 0 auto;
    }
    .section-head .tool-strip{
      width:auto;
    }
    .filter-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:16px;
    }
    .filter-chip{
      appearance:none;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(0,0,0,.14);
      color:var(--muted);
      border-radius:999px;
      padding:7px 10px;
      font-size:12px;
      cursor:pointer;
      transition:border-color .12s ease, color .12s ease, background .12s ease;
    }
    .filter-chip.active{
      border-color:rgba(92,255,214,.22);
      background:rgba(92,255,214,.10);
      color:var(--accent);
    }
    .console{
      min-height:420px;
      padding:14px;
      border:1px solid rgba(255,255,255,.06);
      border-radius:16px;
      background:rgba(3,8,12,.82);
      box-shadow:0 0 0 1px rgba(92,255,214,.05) inset;
      font:12px/1.42 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      word-break:break-word;
      color:#dbe9ef;
    }
    .entry{
      display:grid;
      gap:6px;
      padding:8px 10px 8px 14px;
      border-bottom:1px solid rgba(255,255,255,.04);
      position:relative;
    }
    .entry:last-child{border-bottom:none}
    .entry::before{
      content:"";
      position:absolute;
      left:0;
      top:8px;
      bottom:8px;
      width:2px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
    }
    .entry-head{
      display:grid;
      grid-template-columns:176px 76px auto 48px;
      gap:10px;
      align-items:start;
    }
    .entry-no{
      font-size:11px;
      color:rgba(137,163,173,.72);
      text-align:right;
      justify-self:end;
      user-select:none;
    }
    .entry-time{
      font-size:11px;
      color:#b8c9d1;
      white-space:nowrap;
    }
    .entry-lines{
      color:var(--muted);
      white-space:nowrap;
      font-size:10px;
      letter-spacing:.04em;
      text-transform:uppercase;
      justify-self:end;
    }
    .entry-level{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:64px;
      padding:1px 6px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      font-size:10px;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .entry-text{
      min-width:0;
      margin:0;
      color:#dbe9ef;
      white-space:pre-wrap;
      line-height:1.4;
    }
    .entry[data-level="INFO"]::before{background:rgba(215,247,255,.16)}
    .entry[data-level="DEBUG"]::before{background:rgba(154,215,255,.28)}
    .entry[data-level="WARNING"]::before{background:rgba(255,210,122,.38)}
    .entry[data-level="ERROR"]::before,
    .entry[data-level="CRITICAL"]::before{background:rgba(255,154,187,.44)}
    .entry[data-level="INFO"] .entry-level{color:#d7f7ff;border-color:rgba(215,247,255,.12)}
    .entry[data-level="DEBUG"] .entry-level{color:#9ad7ff;border-color:rgba(154,215,255,.18)}
    .entry[data-level="WARNING"] .entry-level{color:#ffd27a;border-color:rgba(255,210,122,.18)}
    .entry[data-level="ERROR"] .entry-level,
    .entry[data-level="CRITICAL"] .entry-level{color:#ff9abb;border-color:rgba(255,154,187,.22)}
    .entry:hover{background:rgba(255,255,255,.02)}
    mark{
      padding:1px 4px;
      border-radius:6px;
      background:rgba(92,255,214,.16);
      color:var(--fg);
      box-shadow:0 0 0 1px rgba(92,255,214,.14) inset;
    }
    .empty{
      padding:20px 16px;
      border:1px dashed rgba(255,255,255,.10);
      border-radius:14px;
      color:var(--muted);
      background:rgba(0,0,0,.10);
      text-align:center;
    }
    .banner{
      position:fixed;
      top:50%;
      left:50%;
      width:min(520px, calc(100vw - 40px));
      min-width:min(320px, calc(100vw - 40px));
      padding:20px 22px;
      border-radius:22px;
      transform:translate(-50%, -50%) scale(.98);
      z-index:20;
      border:1px solid rgba(255,255,255,.10);
      background:
        radial-gradient(520px 220px at 20% 0%, rgba(92,255,214,.14), transparent 60%),
        radial-gradient(420px 200px at 100% 10%, rgba(122,167,255,.10), transparent 60%),
        rgba(6,14,20,.90);
      box-shadow:
        0 28px 80px rgba(0,0,0,.48),
        0 0 0 1px rgba(92,255,214,.08) inset;
      color:var(--fg);
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
      overflow:hidden;
    }
    .banner.show{
      opacity:1;
      transform:translate(-50%, -50%) scale(1);
    }
    .banner::before{
      content:"";
      position:absolute;
      inset:auto -12% 0 -12%;
      height:2px;
      background:linear-gradient(90deg, transparent, rgba(92,255,214,.92), rgba(122,167,255,.55), transparent);
      box-shadow:0 0 18px rgba(92,255,214,.28);
      opacity:.9;
      animation:bannerSweep 1.8s linear infinite;
    }
    .banner::after{
      content:"";
      position:absolute;
      inset:50% auto auto 50%;
      width:26px;
      height:26px;
      border-radius:999px;
      border:1px solid rgba(92,255,214,.30);
      transform:translate(-50%, -50%) scale(.24);
      opacity:0;
      pointer-events:none;
    }
    .banner.show::after{
      animation:bannerRipple .7s ease-out 1;
    }
    .banner.show:not(.err){
      animation:bannerConfirm .26s ease-out 1, bannerOkPulse 1s ease-in-out 1;
    }
    .banner.err{
      border-color:rgba(255,92,154,.22);
      background:
        radial-gradient(520px 220px at 20% 0%, rgba(255,92,154,.16), transparent 60%),
        radial-gradient(420px 200px at 100% 10%, rgba(122,167,255,.10), transparent 60%),
        rgba(20,8,14,.92);
      box-shadow:
        0 28px 80px rgba(0,0,0,.48),
        0 0 0 1px rgba(255,92,154,.10) inset;
    }
    .banner.err::before{
      background:linear-gradient(90deg, transparent, rgba(255,92,154,.92), rgba(122,167,255,.55), transparent);
      box-shadow:0 0 18px rgba(255,92,154,.35);
    }
    .banner.err::after{
      border-color:rgba(255,92,154,.34);
    }
    .banner.err.show{
      animation:bannerAlert .34s ease-out 1, bannerPulse 1.3s ease-in-out 2;
    }
    .banner strong{
      display:block;
      margin-bottom:10px;
      font-size:18px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .banner span{
      font-size:14px;
      line-height:1.65;
      color:var(--muted);
    }
    .page-footer-slot{
      padding:20px 0 24px;
    }
    .shell-footer{
      margin:0;
      text-align:center;
      color:var(--footer-fg);
      font-size:12px;
    }
    @keyframes bannerSweep{
      0%{transform:translateX(-28%)}
      100%{transform:translateX(28%)}
    }
    @keyframes bannerAlert{
      0%,100%{transform:translate(-50%, -50%) scale(1)}
      20%{transform:translate(-50%, -50%) translateX(-5px) scale(1.01)}
      40%{transform:translate(-50%, -50%) translateX(5px) scale(1.01)}
      60%{transform:translate(-50%, -50%) translateX(-3px) scale(1)}
      80%{transform:translate(-50%, -50%) translateX(3px) scale(1)}
    }
    @keyframes bannerConfirm{
      0%{transform:translate(-50%, -50%) scale(.975)}
      55%{transform:translate(-50%, -50%) scale(1.01)}
      100%{transform:translate(-50%, -50%) scale(1)}
    }
    @keyframes bannerPulse{
      0%,100%{
        box-shadow:
          0 28px 80px rgba(0,0,0,.48),
          0 0 0 1px rgba(255,92,154,.10) inset;
      }
      50%{
        box-shadow:
          0 28px 80px rgba(0,0,0,.48),
          0 0 0 1px rgba(255,92,154,.16) inset,
          0 0 28px rgba(255,92,154,.14);
      }
    }
    @keyframes bannerOkPulse{
      0%,100%{
        box-shadow:
          0 28px 80px rgba(0,0,0,.48),
          0 0 0 1px rgba(92,255,214,.08) inset;
      }
      50%{
        box-shadow:
          0 28px 80px rgba(0,0,0,.48),
          0 0 0 1px rgba(92,255,214,.14) inset,
          0 0 26px rgba(92,255,214,.12);
      }
    }
    @keyframes bannerRipple{
      0%{opacity:.4; transform:translate(-50%, -50%) scale(.24)}
      100%{opacity:0; transform:translate(-50%, -50%) scale(16)}
    }
    @media (max-width: 980px){
      .page-summary-grid{grid-template-columns:1fr 1fr}
      .section-head{flex-direction:column; align-items:stretch}
    }
    @media (max-width: 720px){
      .page-summary-grid{grid-template-columns:1fr}
      .search{max-width:none}
      .entry-head{grid-template-columns:1fr 44px}
      .entry-time,.entry-level,.entry-lines{grid-column:1}
      .entry-no{grid-column:2; grid-row:1; align-self:start}
      .entry-lines{justify-self:start}
    }
    @media (prefers-reduced-motion: reduce){
      .signal-title::before,
      .signal-title::after,
      .banner,
      .banner::before,
      .banner::after{
        animation:none;
      }
      .signal-title::before{opacity:0}
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="banner" id="banner" aria-live="polite" aria-atomic="true"></div>

  <main class="wrap">
    <section class="card">
      <div class="bar">
        <div class="bar-start">
          <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>
        <div class="bar-end">
          <div class="chip">workspace</div>
        </div>
      </div>
      <div class="pad hero-head-pad">
        <div class="eyebrow">Helix</div>
        <h1><span class="hero-title signal-title" data-text="Server Logs">Server Logs</span></h1>
        <p class="sub">集中查看近期记录，并按需要筛选。</p>
        <div id="page-nav"></div>
      </div>
    </section>

    <section class="hero-tools-section">
      <div class="hero-tools tool-strip">
        <button class="hero-tool-mark" type="button" id="refresh-logs">Refresh</button>
        <button class="hero-tool-mark" type="button" id="copy-log-path">Copy Path</button>
        <div class="chip" id="refresh-time">sync pending</div>
        <label class="chip" for="auto-refresh">
          <input id="auto-refresh" type="checkbox" checked />
          <span>auto sync</span>
        </label>
      </div>
    </section>

    <section class="page-summary-grid" id="metrics"></section>

    <section class="page-content-grid">
      <section class="card main-panel-card">
        <div class="bar">
          <div class="bar-start">
            <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="chip">log stream</div>
          </div>
          <div class="bar-end">
            <div class="chip" id="log-count">0/0</div>
          </div>
        </div>
        <div class="section">
          <div class="section-head">
            <div class="section-title-wrap">
              <h2 class="section-title">Server Output</h2>
            </div>
            <div class="section-tools tool-strip">
              <input class="search" id="log-search" type="search" placeholder="Search logs" />
            </div>
          </div>
          <div class="filter-row" id="level-filters"></div>
          <div class="console" id="log-console"></div>
        </div>
      </section>
    </section>

    <div class="page-footer-slot" id="page-footer"></div>
  </main>

  <script>
    function escapeHtml(value){
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeRegExp(value){
      return String(value || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function mountNav(targetId, nav, activeHref){
      const root = document.getElementById(targetId);
      if(!root) return;
      root.innerHTML = `
        <nav class="shell-nav" aria-label="workspace">
          ${nav.map((item) => `
            <a class="shell-nav-link${item.href === activeHref ? " active" : ""}" href="${item.href}">
              <span>${escapeHtml(item.title)}</span>
            </a>
          `).join("")}
        </nav>
      `;
    }

    function mountFooter(targetId, text){
      const root = document.getElementById(targetId);
      if(!root) return;
      root.innerHTML = `<div class="shell-footer">${escapeHtml(text)}</div>`;
    }

    function shellMessage(kind){
      const dict = {
        synced: ["Synced", "Logs updated."],
        sync_failed: ["Sync Failed", "Unable to update logs."],
        load_failed: ["Load Failed", "Unable to load logs."]
      };
      return dict[kind] || ["Notice", ""];
    }

    mountNav("page-nav", [
      {title:"Workspace", href:"/", tag:"home"},
      {title:"Preferences", href:"/pref", tag:"config"},
      {title:"Code Studio", href:"/code", tag:"batch"},
      {title:"Logs", href:"/logs", tag:"logs"},
      {title:"Runtime", href:"/idle", tag:"runtime"}
    ], "/logs");
    mountFooter("page-footer", "HELIX · workspace · v__APP_VERSION__");

    const banner = document.getElementById("banner");
    const metricsHost = document.getElementById("metrics");
    const filtersHost = document.getElementById("level-filters");
    const consoleHost = document.getElementById("log-console");
    const refreshTime = document.getElementById("refresh-time");
    const refreshButton = document.getElementById("refresh-logs");
    const autoRefresh = document.getElementById("auto-refresh");
    const searchInput = document.getElementById("log-search");
    const countChip = document.getElementById("log-count");
    const copyPathButton = document.getElementById("copy-log-path");
    const previewMode = location.protocol === "file:";
    const previewPayload = {
      exists: true,
      path: "/preview/data/storage/helix.log",
      line_count: 7,
      truncated: false,
      size: 248,
      lines: [
        "2026-03-22 10:08:11.102 | INFO     | helix boot",
        "2026-03-22 10:08:12.328 | DEBUG    | idle watcher ready",
        "2026-03-22 10:08:14.884 | WARNING  | runtime queue delayed",
        "2026-03-22 10:08:18.015 | ERROR    | probe failed: preview",
        "Traceback (most recent call last):",
        "  File \"preview.py\", line 18, in <module>",
        "RuntimeError: preview failure"
      ]
    };
    let logData = previewPayload;
    let refreshTimer = null;
    let levelScope = "all";

    function showBanner(title, detail, kind = ""){
      banner.className = kind ? `banner show ${kind}` : "banner show";
      banner.innerHTML = `<strong>${title}</strong><span>${detail}</span>`;
      clearTimeout(showBanner.timer);
      showBanner.timer = setTimeout(() => banner.classList.remove("show"), 1800);
    }

    function fmtClock(date){
      return date.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
    }

    function levelOf(line){
      const hit = String(line || "").match(/\|\s([A-Z]+)\s+\|/);
      return hit ? hit[1] : "INFO";
    }

    function parseLogLine(line){
      const raw = String(line || "");
      const match = raw.match(/^(.+?)\s+\|\s+([A-Z]+)\s+\|\s+(.*)$/);
      if(!match){
        return {time:"", level:levelOf(raw), message:raw, structured:false};
      }
      return {
        time: match[1],
        level: match[2],
        message: match[3],
        structured: true
      };
    }

    function buildLogEntries(lines){
      return lines.reduce((entries, line, index) => {
        const parsed = parseLogLine(line);
        const current = entries[entries.length - 1];
        if(parsed.structured || !current){
          entries.push({
            startLine: index + 1,
            lineCount: 1,
            time: parsed.time,
            level: parsed.level,
            message: parsed.message,
            raw: String(line || "")
          });
          return entries;
        }
        current.lineCount += 1;
        current.message = `${current.message}\n${parsed.message}`;
        current.raw = `${current.raw}\n${String(line || "")}`;
        return entries;
      }, []);
    }

    function highlightText(value, query){
      const raw = String(value || "");
      if(!query) return escapeHtml(raw);
      const re = new RegExp(`(${escapeRegExp(query)})`, "ig");
      return escapeHtml(raw).replace(re, "<mark>$1</mark>");
    }

    function renderMetrics(data){
      const lines = Array.isArray(data.lines) ? data.lines : [];
      const entries = buildLogEntries(lines);
      const levels = entries.reduce((acc, entry) => {
        const level = entry.level;
        acc[level] = (acc[level] || 0) + 1;
        return acc;
      }, {});
      metricsHost.innerHTML = `
        <div class="metric">
          <b>Log Entries</b>
          <div class="value">${entries.length}</div>
          <div class="meta">${data.line_count || 0} lines · ${data.truncated ? "tail view" : "full view"}</div>
        </div>
        <div class="metric">
          <b>Errors</b>
          <div class="value">${levels.ERROR || 0}</div>
          <div class="meta">${levels.CRITICAL || 0} critical</div>
        </div>
        <div class="metric">
          <b>Warnings</b>
          <div class="value">${levels.WARNING || 0}</div>
          <div class="meta">${levels.INFO || 0} info</div>
        </div>
        <div class="metric">
          <b>Source</b>
          <div class="value">${previewMode ? "Preview" : "Local"}</div>
          <div class="meta">${escapeHtml(data.path || "log path")}</div>
        </div>
      `;
    }

    function renderLevelFilters(entries){
      const counts = entries.reduce((acc, entry) => {
        const level = entry.level;
        acc[level] = (acc[level] || 0) + 1;
        return acc;
      }, {});
      const levels = ["all", "INFO", "DEBUG", "WARNING", "ERROR", "CRITICAL"]
        .filter((key) => key === "all" || counts[key]);
      filtersHost.innerHTML = levels.map((level) => `
        <button class="filter-chip${levelScope === level ? " active" : ""}" type="button" data-level="${level}">
          ${level} ${level === "all" ? entries.length : counts[level]}
        </button>
      `).join("");
      filtersHost.onclick = (event) => {
        const button = event.target.closest("button[data-level]");
        if(!button) return;
        levelScope = button.getAttribute("data-level") || "all";
        renderConsole(logData);
      };
    }

    function renderConsole(data){
      const lines = Array.isArray(data.lines) ? data.lines : [];
      const entries = buildLogEntries(lines);
      const query = String(searchInput.value || "").trim().toLowerCase();
      const filtered = entries.filter((entry) => {
        if(levelScope !== "all" && entry.level !== levelScope) return false;
        if(query && !entry.raw.toLowerCase().includes(query)) return false;
        return true;
      });
      countChip.textContent = `${filtered.length}/${entries.length}`;
      consoleHost.innerHTML = filtered.length
        ? filtered.map((entry, index) => `<div class="entry" data-level="${entry.level}">
              <div class="entry-head">
                <span class="entry-time">${highlightText(entry.time || "--", query)}</span>
                <span class="entry-level">${highlightText(entry.level, query)}</span>
                <span class="entry-lines">${entry.lineCount} ${entry.lineCount === 1 ? "line" : "lines"}</span>
                <span class="entry-no">${index + 1}</span>
              </div>
              <pre class="entry-text">${highlightText(entry.message, query)}</pre>
            </div>`).join("")
        : `<div class="empty">No log entries match current filters.</div>`;
      renderLevelFilters(entries);
    }

    async function loadLogs(options = {}){
      const {silent = false} = options;
      if(previewMode){
        logData = previewPayload;
        renderMetrics(logData);
        renderConsole(logData);
        refreshTime.textContent = "preview mode";
        return;
      }
      refreshTime.textContent = "syncing";
      const resp = await fetch("/api/logs", {cache:"no-store"});
      if(!resp.ok) throw new Error("logs load failed");
      const payload = await resp.json();
      logData = payload.data || {lines:[]};
      renderMetrics(logData);
      renderConsole(logData);
      refreshTime.textContent = `updated ${fmtClock(new Date())}`;
      if(!silent){
        const [title, detail] = shellMessage("synced");
        showBanner(title, detail, "");
      }
    }

    function scheduleRefresh(){
      if(refreshTimer){
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
      if(previewMode || !autoRefresh.checked) return;
      refreshTimer = setInterval(() => {
        loadLogs({silent:true}).catch(() => {
          refreshTime.textContent = "sync failed";
          const [title, detail] = shellMessage("sync_failed");
          showBanner(title, detail, "err");
        });
      }, 12000);
    }

    refreshButton.addEventListener("click", () => {
      loadLogs().catch(() => {
        refreshTime.textContent = "sync failed";
        const [title, detail] = shellMessage("sync_failed");
        showBanner(title, detail, "err");
      });
    });
    copyPathButton.addEventListener("click", async () => {
      const target = (logData && logData.path) || "";
      if(!target) return;
      try{
        await navigator.clipboard.writeText(target);
        showBanner("Copied", "Log path copied.", "");
      }catch(_err){
        showBanner("Copy Failed", "Unable to copy the log path.", "err");
      }
    });
    autoRefresh.addEventListener("change", scheduleRefresh);
    searchInput.addEventListener("input", () => renderConsole(logData));

    loadLogs().catch(() => {
      refreshTime.textContent = "sync failed";
      const [title, detail] = shellMessage("load_failed");
      showBanner(title, detail, "err");
      renderMetrics({lines:[], line_count:0, path:"log path", truncated:false, exists:false});
      consoleHost.innerHTML = `<div class="empty">Unable to load current logs.</div>`;
      pathChip.textContent = "unavailable";
    });
    scheduleRefresh();
  </script>
</body>
</html>
