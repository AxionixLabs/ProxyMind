<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Helix</title>
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="shortcut icon" href="/static/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Helix" />
  <link rel="manifest" href="/static/site.webmanifest" />
  <style>
    :root{
      --bg:#05060a;
      --fg:#d7f7ff;
      --muted:#89a3ad;
      --line:rgba(255,255,255,.08);
      --accent:#5cffd6;
      --accent2:#7aa7ff;
      --ok:#5cff7a;
      --danger:#ff5c9a;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      color:var(--fg);
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(122,167,255,.12), transparent 55%),
        radial-gradient(900px 600px at 80% 30%, rgba(92,255,214,.12), transparent 60%),
        radial-gradient(700px 500px at 55% 80%, rgba(255,92,154,.10), transparent 60%),
        var(--bg);
      font:14px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }
    .aurora{
      position:fixed;
      inset:-20% -10% auto -10%;
      height:72vh;
      background:
        radial-gradient(40% 55% at 18% 24%, rgba(92,255,214,.16), transparent 68%),
        radial-gradient(36% 48% at 76% 18%, rgba(122,167,255,.14), transparent 70%),
        radial-gradient(28% 38% at 52% 10%, rgba(255,92,154,.10), transparent 72%);
      filter:blur(24px);
      opacity:.9;
      pointer-events:none;
      animation: auroraShift 16s ease-in-out infinite alternate;
    }
    @keyframes auroraShift{
      0%{transform:translate3d(0, 0, 0) scale(1)}
      50%{transform:translate3d(1.5%, 2%, 0) scale(1.04)}
      100%{transform:translate3d(-2%, 4%, 0) scale(1.08)}
    }
    .grid{
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size:44px 44px;
      mask-image: radial-gradient(680px 540px at 50% 18%, black 40%, transparent 82%);
      opacity:.5;
      pointer-events:none;
    }
    .scan{
      position:fixed;
      inset:-60px 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.035),
        rgba(255,255,255,.035) 1px,
        transparent 2px,
        transparent 6px
      );
      opacity:.22;
      mix-blend-mode:overlay;
      animation: scan 8s linear infinite;
      pointer-events:none;
    }
    @keyframes scan{
      0%{transform:translateY(-40px)}
      100%{transform:translateY(40px)}
    }
    .rays{
      position:fixed;
      inset:-20% 0 auto 0;
      height:56vh;
      background:
        linear-gradient(120deg, transparent 0%, rgba(92,255,214,.06) 34%, transparent 58%),
        linear-gradient(70deg, transparent 8%, rgba(122,167,255,.06) 40%, transparent 64%);
      mix-blend-mode:screen;
      opacity:.56;
      transform-origin:50% 0%;
      animation: rayDrift 18s linear infinite;
      pointer-events:none;
    }
    @keyframes rayDrift{
      0%{transform:translateX(-6%) skewY(-4deg)}
      50%{transform:translateX(4%) skewY(-2deg)}
      100%{transform:translateX(-6%) skewY(-4deg)}
    }
    .particles{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.72;
      filter: drop-shadow(0 0 10px rgba(92,255,214,.25));
    }
    .dot{
      position:absolute;
      width:2px;
      height:2px;
      background:rgba(215,247,255,.85);
      border-radius:999px;
      animation: float var(--t) linear infinite;
      transform:translateY(120vh);
    }
    @keyframes float{
      0%{transform:translateY(120vh) translateX(0)}
      100%{transform:translateY(-20vh) translateX(var(--dx))}
    }
    .wrap{
      position:relative;
      width:min(1120px, calc(100% - 32px));
      margin:28px auto 32px;
    }
    .stack{
      display:grid;
      gap:16px;
    }
    .card{
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow:
        0 30px 90px rgba(0,0,0,.65),
        0 0 0 1px rgba(92,255,214,.06) inset;
      backdrop-filter:blur(10px);
      overflow:hidden;
      position:relative;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(700px 300px at 20% 0%, rgba(92,255,214,.12), transparent 55%),
        radial-gradient(600px 260px at 100% 10%, rgba(122,167,255,.10), transparent 60%);
      pointer-events:none;
    }
    .beam{
      position:absolute;
      left:-20%;
      top:-40%;
      width:140%;
      height:140%;
      background: conic-gradient(from 90deg, transparent, rgba(92,255,214,.12), transparent, rgba(122,167,255,.10), transparent);
      filter: blur(24px);
      opacity:.35;
      animation: spin 14s linear infinite;
      pointer-events:none;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .bar{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 18px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background:rgba(0,0,0,.18);
    }
    .dots{display:flex; gap:8px}
    .dots i{width:10px; height:10px; border-radius:999px; display:block}
    .dots i:nth-child(1){background:rgba(255,92,154,.9)}
    .dots i:nth-child(2){background:rgba(255,210,122,.9)}
    .dots i:nth-child(3){background:rgba(92,255,122,.9)}
    .chip{
      font-size:12px;
      color:var(--muted);
      border:1px solid rgba(255,255,255,.09);
      border-radius:999px;
      padding:6px 10px;
      background:rgba(0,0,0,.16);
    }
    .pad{
      position:relative;
      z-index:1;
      padding:20px 18px 18px;
    }
    .hero{
      display:block;
    }
    .hero-main{
      width:min(760px, 100%);
    }
    .title{
      margin:0;
      font-size:clamp(28px, 4.4vw, 36px);
      letter-spacing:.10em;
      text-transform:uppercase;
      text-shadow:0 0 12px rgba(92,255,214,.12);
    }
    .glitch{
      position:relative;
      display:inline-block;
    }
    .glitch::before,
    .glitch::after{
      content:attr(data-text);
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.72;
      mix-blend-mode:screen;
    }
    .glitch::before{
      color:rgba(122,167,255,.92);
      transform:translateX(-1px);
      clip-path:inset(0 0 0 0);
      animation: glitchA 2.4s infinite steps(10, end);
    }
    .glitch::after{
      color:rgba(92,255,214,.92);
      transform:translateX(1px);
      clip-path:inset(0 0 0 0);
      animation: glitchB 2s infinite steps(11, end);
    }
    @keyframes glitchA{
      0%{clip-path: inset(0 0 85% 0)}
      10%{clip-path: inset(0 0 10% 0)}
      20%{clip-path: inset(30% 0 55% 0)}
      30%{clip-path: inset(65% 0 15% 0)}
      40%{clip-path: inset(5% 0 75% 0)}
      50%{clip-path: inset(55% 0 35% 0)}
      60%{clip-path: inset(10% 0 60% 0)}
      70%{clip-path: inset(75% 0 5% 0)}
      80%{clip-path: inset(25% 0 50% 0)}
      90%{clip-path: inset(45% 0 35% 0)}
      100%{clip-path: inset(0 0 85% 0)}
    }
    @keyframes glitchB{
      0%{clip-path: inset(80% 0 0 0)}
      12%{clip-path: inset(20% 0 55% 0)}
      24%{clip-path: inset(45% 0 35% 0)}
      36%{clip-path: inset(10% 0 70% 0)}
      48%{clip-path: inset(60% 0 15% 0)}
      60%{clip-path: inset(30% 0 50% 0)}
      72%{clip-path: inset(75% 0 5% 0)}
      84%{clip-path: inset(5% 0 78% 0)}
      100%{clip-path: inset(80% 0 0 0)}
    }
    .sub{
      margin:10px 0 0;
      max-width:none;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .eyebrow{
      color:var(--accent);
      letter-spacing:.16em;
      text-transform:uppercase;
      font-size:12px;
      margin-bottom:6px;
    }
    .shell-nav{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:18px;
    }
    .shell-nav-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(0,0,0,.16);
      color:var(--fg);
      text-decoration:none;
      font-size:12px;
      transition:border-color .12s ease, transform .12s ease, background .12s ease;
    }
    .shell-nav-link:hover{
      transform:translateY(-1px);
      border-color:rgba(92,255,214,.32);
      background:rgba(255,255,255,.04);
    }
    .shell-nav-link.active{
      border-color:rgba(92,255,214,.18);
      background:rgba(92,255,214,.08);
      color:var(--accent);
    }
    .shell-nav-link code{
      color:var(--accent2);
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .overview{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:12px;
      margin-top:20px;
    }
    .status-card{
      padding:14px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      background:rgba(0,0,0,.14);
      box-shadow:0 0 0 1px rgba(92,255,214,.05) inset;
      display:grid;
      gap:8px;
    }
    .status-card b{
      font-size:12px;
      color:var(--muted);
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .status-value{
      font-size:20px;
      line-height:1.1;
      letter-spacing:.02em;
    }
    .status-meta{
      font-size:12px;
      color:var(--muted);
    }
    .primary-action{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-top:18px;
      padding:16px;
      min-height:92px;
      border:1px solid rgba(92,255,214,.18);
      border-radius:16px;
      background:linear-gradient(135deg, rgba(0,0,0,.24), rgba(9,20,28,.44));
      color:var(--fg);
      text-decoration:none;
      box-shadow:
        0 0 0 1px rgba(92,255,214,.06) inset,
        0 12px 32px rgba(0,0,0,.24);
      transition:transform .12s ease, border-color .12s ease;
    }
    .primary-action > div{
      flex:1 1 auto;
      min-width:0;
    }
    .primary-action:hover{
      transform:translateY(-1px);
      border-color:rgba(92,255,214,.34);
    }
    .primary-action strong{
      display:block;
      font-size:15px;
      font-weight:600;
      letter-spacing:.02em;
    }
    .primary-action span{
      display:block;
      margin-top:6px;
      color:rgba(215,247,255,.8);
      font-size:12px;
      line-height:1.45;
    }
    .primary-mark{
      flex:0 0 auto;
      font-size:11px;
      color:var(--accent);
      padding:4px 10px;
      border-radius:999px;
      background:rgba(92,255,214,.10);
      border:1px solid rgba(92,255,214,.18);
      box-shadow:0 0 14px rgba(92,255,214,.12);
    }
    .actions{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:10px;
      margin-top:12px;
    }
    @media (max-width: 760px){
      .actions{grid-template-columns:1fr}
    }
    @media (max-width: 620px){
      .actions{grid-template-columns:1fr}
    }
    .action{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:14px;
      min-height:92px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      background:rgba(0,0,0,.14);
      color:var(--fg);
      text-decoration:none;
      transition:transform .12s ease, border-color .12s ease;
      box-shadow:0 0 0 1px rgba(92,255,214,.05) inset;
    }
    .action > div{
      flex:1 1 auto;
      min-width:0;
    }
    .action:hover{
      transform:translateY(-1px);
      border-color:rgba(92,255,214,.35);
    }
    .action strong{
      display:block;
      font-size:15px;
      font-weight:600;
    }
    .action span{
      display:block;
      margin-top:4px;
      font-size:12px;
      line-height:1.45;
      color:var(--muted);
    }
    .tag{
      flex:0 0 auto;
      font-size:11px;
      color:rgba(0,0,0,.85);
      padding:2px 8px;
      border-radius:999px;
      background:rgba(92,255,214,.9);
      box-shadow:0 0 14px rgba(92,255,214,.25);
    }
    .status-list{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
      margin-top:18px;
    }
    .led{
      width:8px;
      height:8px;
      border-radius:999px;
      background:var(--ok);
      box-shadow:0 0 0 3px rgba(92,255,122,.12), 0 0 14px rgba(92,255,122,.55);
    }
    .status-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      background:rgba(0,0,0,.14);
      font-size:12px;
      color:var(--fg);
    }
    .status-pill code{
      color:var(--accent);
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .tip{
      margin-top:16px;
      max-width:72ch;
      color:var(--muted);
      font-size:12px;
    }
    .tip code{color:var(--accent2)}
    .toast-stage{
      position:fixed;
      top:24px;
      left:50%;
      transform:translateX(-50%);
      z-index:30;
      pointer-events:none;
    }
    .toast{
      min-width:280px;
      max-width:min(420px, calc(100vw - 32px));
      padding:14px 16px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(6,14,20,.88);
      box-shadow:0 18px 44px rgba(0,0,0,.35), 0 0 0 1px rgba(92,255,214,.08) inset;
      backdrop-filter:blur(12px);
      opacity:0;
      transform:translate(-50%, -8px) scale(.98);
      transition:opacity .18s ease, transform .18s ease;
      position:relative;
      left:50%;
    }
    .toast.show{
      opacity:1;
      transform:translate(-50%, 0) scale(1);
    }
    .toast.err{
      border-color:rgba(255,92,154,.26);
      box-shadow:0 18px 44px rgba(0,0,0,.35), 0 0 0 1px rgba(255,92,154,.12) inset;
    }
    .toast-title{
      display:block;
      margin-bottom:4px;
      font-size:13px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--fg);
    }
    .toast-body{
      color:var(--muted);
      font-size:13px;
    }
    .shell-footer{
      margin-top:8px;
      text-align:center;
      color:rgba(137,163,173,.85);
      font-size:12px;
    }
    @media (max-width: 920px){
      .overview{grid-template-columns:repeat(2, minmax(0, 1fr))}
    }
    @media (max-width: 720px){
      .overview{grid-template-columns:1fr}
    }
    @media (prefers-reduced-motion: reduce){
      .aurora,
      .scan,
      .rays,
      .dot,
      .beam,
      .glitch::before,
      .glitch::after{
        animation:none !important;
      }
    }
  </style>
</head>
<body>
  <div class="aurora"></div>
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="rays"></div>
  <div class="particles" aria-hidden="true" id="particles"></div>
  <div class="toast-stage" id="toast-stage" aria-live="polite" aria-atomic="true"></div>

  <main class="wrap">
    <section class="stack">
      <div class="card">
        <div class="beam"></div>
        <div class="bar">
          <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="chip">transport: streamable-http</div>
        </div>
        <div class="pad hero">
          <div class="hero-main">
              <div class="eyebrow">Helix</div>
              <h1 class="title"><span class="glitch" data-text="HELIX">HELIX</span></h1>
              <p class="sub">Local workspace for preferences, diagnostics, and runtime inspection.</p>
              <div id="page-nav"></div>

              <div class="overview" id="overview-cards"></div>

              <div id="primary-entry"></div>

              <div class="actions" id="secondary-entries"></div>

              <div class="status-list">
                <span class="status-pill" id="status-pill"><span class="led"></span><span id="ready-text">checking</span></span>
                <span class="status-pill"><code>/mcp</code></span>
                <span class="status-pill"><code>/code</code></span>
                <span class="status-pill"><code>/idle</code></span>
                <span class="status-pill"><code>/pref</code></span>
                <span class="status-pill"><code>/logs</code></span>
                <span class="status-pill" id="version-pill">v__APP_VERSION__</span>
                <span class="status-pill" id="refresh-pill">syncing</span>
              </div>

              <div class="tip" id="entry-tip"></div>
          </div>
        </div>
      </div>
    </section>

    <div id="page-footer"></div>
  </main>

  <script>
    const host = document.getElementById("particles");
    const width = () => window.innerWidth;
    const overviewHost = document.getElementById("overview-cards");
    const primaryEntryHost = document.getElementById("primary-entry");
    const secondaryEntriesHost = document.getElementById("secondary-entries");
    const entryTipHost = document.getElementById("entry-tip");
    const toastStage = document.getElementById("toast-stage");
    const entryConfig = {
      nav: [
        {title: "Preferences", href: "/pref", tag: "config", primary: true},
        {title: "Code Studio", href: "/code", tag: "batch"},
        {title: "Logs", href: "/logs", tag: "logs"},
        {title: "OpenAPI", href: "/docs", tag: "schema"},
        {title: "Health", href: "/ready", tag: "health"},
        {title: "Runtime", href: "/idle", tag: "runtime"}
      ],
      overview: [
        {key: "ready", title: "Ready", value: "Checking", meta: "/ready"},
        {key: "version", title: "Version", value: "Loading", meta: "/version"},
        {key: "idle", title: "Idle Queue", value: "Loading", meta: "/idle"},
        {key: "transport", title: "Transport", value: "HTTP", meta: "/mcp"}
      ],
      primary: {
        title: "Preferences",
        description: "Open local model slots and provider configuration.",
        href: "/pref",
        tag: "PRIMARY"
      },
      secondary: [
        {
          title: "Code Studio",
          description: "Compose a batch blueprint with a visual shell.",
          href: "/code",
          tag: "UI"
        },
        {
          title: "Logs",
          description: "Inspect local server logs.",
          href: "/logs",
          tag: "UI"
        },
        {
          title: "OpenAPI",
          description: "Browse local schema and routes.",
          href: "/docs",
          tag: "UI"
        },
        {
          title: "Health",
          description: "Inspect current health response.",
          href: "/ready",
          tag: "GET"
        },
        {
          title: "Runtime",
          description: "Inspect current queue snapshot.",
          href: "/idle",
          tag: "GET"
        }
      ],
      tipLines: [
        "Keyboard: <code>R</code> refresh status, <code>C</code> code, <code>I</code> idle, <code>P</code> preferences, <code>L</code> logs."
      ]
    };

    function showToast(title, detail, kind = ""){
      toastStage.innerHTML = "";
      const toast = document.createElement("div");
      toast.className = kind ? `toast ${kind}` : "toast";
      toast.innerHTML = `
        <strong class="toast-title">${title}</strong>
        <span class="toast-body">${detail}</span>
      `;
      toastStage.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add("show"));
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 180);
      }, 1800);
    }

    function escapeHtml(value){
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function mountNav(targetId, nav, activeHref){
      const root = document.getElementById(targetId);
      if(!root) return;
      root.innerHTML = `
        <nav class="shell-nav" aria-label="workspace">
          ${nav.map((item) => `
            <a class="shell-nav-link${item.href === activeHref ? " active" : ""}" href="${item.href}">
              <span>${escapeHtml(item.title)}</span>
              <code>${escapeHtml(item.tag)}</code>
            </a>
          `).join("")}
        </nav>
      `;
    }

    function mountFooter(targetId, text){
      const root = document.getElementById(targetId);
      if(!root) return;
      root.innerHTML = `<div class="shell-footer">${escapeHtml(text)}</div>`;
    }

    function shellMessage(kind){
      const dict = {
        module_open: ["Open Module", "Opening module."],
        synced: ["Synced", "Status updated."],
        sync_failed: ["Sync Failed", "Unable to update status."]
      };
      return dict[kind] || ["Notice", ""];
    }

    function renderOverview(cards){
      overviewHost.innerHTML = cards.map((card) => `
        <div class="status-card" data-card="${card.key}">
          <b>${card.title}</b>
          <div class="status-value" data-value="${card.key}">${card.value}</div>
          <div class="status-meta" data-meta="${card.key}">${card.meta}</div>
        </div>
      `).join("");
    }

    function summarizeIdle(payload){
      const pendingCount = Array.isArray(payload.pending)
        ? payload.pending.length
        : Array.isArray(payload.jobs)
          ? payload.jobs.length
          : typeof payload.pending_total === "number"
            ? payload.pending_total
            : typeof payload.total === "number"
              ? payload.total
              : 0;
      const sessionCount = payload.sessions && typeof payload.sessions === "object"
        ? Object.keys(payload.sessions).length
        : typeof payload.active_sessions === "number"
          ? payload.active_sessions
          : 0;
      const runningCount = Array.isArray(payload.running)
        ? payload.running.length
        : typeof payload.running_total === "number"
          ? payload.running_total
          : sessionCount;
      const total = pendingCount + runningCount;

      let meta = "queue is clear";
      if(runningCount && pendingCount){
        meta = `${runningCount} running · ${pendingCount} pending`;
      }else if(runningCount){
        meta = `${runningCount} active job${runningCount > 1 ? "s" : ""}`;
      }else if(pendingCount){
        meta = `${pendingCount} queued job${pendingCount > 1 ? "s" : ""}`;
      }

      return {value: String(total), meta};
    }

    function renderPrimaryEntry(entry){
      primaryEntryHost.innerHTML = `
        <a class="primary-action" href="${entry.href}">
          <div>
            <strong>${entry.title}</strong>
            <span>${entry.description}</span>
          </div>
          <span class="primary-mark">${entry.tag}</span>
        </a>
      `;
    }

    function renderSecondaryEntries(entries){
      secondaryEntriesHost.innerHTML = entries.map((entry) => `
        <a class="action" href="${entry.href}">
          <div>
            <strong>${entry.title}</strong>
            <span>${entry.description}</span>
          </div>
          <span class="tag">${entry.tag}</span>
        </a>
      `).join("");
    }

    function renderTip(lines){
      entryTipHost.innerHTML = lines.map((line) => `<div>${line}</div>`).join("");
    }

    function spawn(n){
      host.innerHTML = "";
      for(let i = 0; i < n; i += 1){
        const d = document.createElement("div");
        d.className = "dot";
        const x = Math.random() * width();
        const t = 6 + Math.random() * 10;
        const dx = (Math.random() * 2 - 1) * 60;
        const delay = -Math.random() * t;
        d.style.left = x + "px";
        d.style.top = (Math.random() * window.innerHeight) + "px";
        d.style.setProperty("--t", t + "s");
        d.style.setProperty("--dx", dx + "px");
        d.style.animationDelay = delay + "s";
        host.appendChild(d);
      }
    }

    renderPrimaryEntry(entryConfig.primary);
    renderSecondaryEntries(entryConfig.secondary);
    renderTip(entryConfig.tipLines);
    mountNav("page-nav", entryConfig.nav, "/");
    mountFooter("page-footer", "HELIX · local workspace · v__APP_VERSION__");
    renderOverview(entryConfig.overview);
    spawn(Math.min(110, Math.floor(window.innerWidth / 10)));
    window.addEventListener("resize", () => {
      spawn(Math.min(110, Math.floor(window.innerWidth / 10)));
    });

    async function loadStatus(){
      const readyText = document.getElementById("ready-text");
      const versionPill = document.getElementById("version-pill");
      const refreshPill = document.getElementById("refresh-pill");
      const readyValue = document.querySelector('[data-value="ready"]');
      const readyMeta = document.querySelector('[data-meta="ready"]');
      const versionValue = document.querySelector('[data-value="version"]');
      const versionMeta = document.querySelector('[data-meta="version"]');
      const idleValue = document.querySelector('[data-value="idle"]');
      const idleMeta = document.querySelector('[data-meta="idle"]');
      const transportValue = document.querySelector('[data-value="transport"]');
      const transportMeta = document.querySelector('[data-meta="transport"]');

      refreshPill.textContent = "syncing";
      transportValue.textContent = "HTTP";
      transportMeta.textContent = "streamable transport";
      try{
        const readyResp = await fetch("/ready", {cache: "no-store"});
        const readyOk = readyResp.ok;
        readyText.textContent = readyOk ? "online" : "degraded";
        readyValue.textContent = readyOk ? "Online" : "Degraded";
        readyMeta.textContent = readyOk ? "runtime reachable" : "status endpoint degraded";
      }catch(_err){
        readyText.textContent = "offline";
        readyValue.textContent = "Offline";
        readyMeta.textContent = "status endpoint unreachable";
      }

      try{
        const versionResp = await fetch("/version", {cache: "no-store"});
        if(versionResp.ok){
          const payload = await versionResp.json();
          if(payload.version){
            versionPill.textContent = "v" + payload.version;
            versionValue.textContent = payload.version;
            versionMeta.textContent = payload.service || "/version";
          }
        }
      }catch(_err){
        versionPill.textContent = "version n/a";
        versionValue.textContent = "N/A";
        versionMeta.textContent = "version unavailable";
      }

      try{
        const idleResp = await fetch("/api/idle", {cache: "no-store"});
        if(idleResp.ok){
          const payload = await idleResp.json();
          const idle = summarizeIdle(payload);
          idleValue.textContent = idle.value;
          idleMeta.textContent = idle.meta;
        }else{
          idleValue.textContent = "N/A";
          idleMeta.textContent = "idle snapshot unavailable";
        }
      }catch(_err){
        idleValue.textContent = "N/A";
        idleMeta.textContent = "idle endpoint unreachable";
      }

      refreshPill.textContent = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
    }

    loadStatus();

    document.getElementById("page-nav").addEventListener("click", (event) => {
      const link = event.target.closest("a");
      if(!link) return;
      const [title] = shellMessage("module_open");
      showToast(title, `Open ${link.getAttribute("href")}`, "");
    });

    secondaryEntriesHost.addEventListener("click", (event) => {
      const link = event.target.closest("a");
      if(!link) return;
      const [title] = shellMessage("module_open");
      showToast(title, `Open ${link.getAttribute("href")}`, "");
    });

    primaryEntryHost.addEventListener("click", () => {
      const [title] = shellMessage("module_open");
      showToast(title, "Open /pref", "");
    });

    window.addEventListener("keydown", (e) => {
      const k = (e.key || "").toLowerCase();
      if (k === "r"){
        loadStatus()
          .then(() => {
            const [title, detail] = shellMessage("synced");
            showToast(title, detail, "");
          })
          .catch(() => {
            const [title, detail] = shellMessage("sync_failed");
            showToast(title, detail, "err");
          });
      }
      if (k === "c") location.href = "/code";
      if (k === "i") location.href = "/idle";
      if (k === "p") location.href = "/pref";
      if (k === "l") location.href = "/logs";
    });
  </script>
</body>
</html>
