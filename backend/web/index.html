<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Helix</title>
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="shortcut icon" href="/static/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Helix" />
  <link rel="manifest" href="/static/site.webmanifest" />
  <style>
    :root{
      --bg:#05060a;
      --fg:#d7f7ff;
      --muted:#89a3ad;
      --line:rgba(255,255,255,.08);
      --accent:#5cffd6;
      --accent2:#7aa7ff;
      --ok:#5cff7a;
      --warn:#ffd27a;
      --danger:#ff5c9a;
      --shadow:0 30px 90px rgba(0,0,0,.65);
      --surface-top:rgba(255,255,255,.06);
      --surface-bottom:rgba(255,255,255,.03);
      --surface-hero-top:rgba(255,255,255,.05);
      --surface-hero-bottom:rgba(255,255,255,.02);
      --surface-inset:rgba(92,255,214,.06);
      --surface-inset-soft:rgba(92,255,214,.04);
      --surface-border-soft:rgba(255,255,255,.10);
      --surface-border-faint:rgba(255,255,255,.08);
      --surface-fill:rgba(0,0,0,.16);
      --surface-fill-soft:rgba(0,0,0,.14);
      --surface-fill-strong:rgba(0,0,0,.18);
      --surface-hover:rgba(255,255,255,.04);
      --accent-fill:rgba(92,255,214,.08);
      --accent-fill-strong:rgba(92,255,214,.10);
      --accent-fill-solid:rgba(92,255,214,.9);
      --accent-border:rgba(92,255,214,.32);
      --accent-border-soft:rgba(92,255,214,.18);
      --accent-ink:rgba(0,0,0,.85);
      --accent-shadow:rgba(92,255,214,.25);
      --accent2-fill:rgba(122,167,255,.12);
      --accent2-fill-strong:rgba(122,167,255,.14);
      --danger-fill:rgba(255,92,154,.08);
      --danger-fill-strong:rgba(255,92,154,.16);
      --overlay-backdrop:rgba(3,7,12,.74);
      --surface-elevated:rgba(6,12,18,.96);
      --title-text:rgba(215,247,255,.96);
      --title-sheen:rgba(255,255,255,.92);
      --title-glow:rgba(92,255,214,.22);
      --title-beam-soft:rgba(122,167,255,.18);
      --title-beam-strong:rgba(92,255,214,.88);
      --grid-line:rgba(255,255,255,.04);
      --dot-danger:#ff6f98;
      --dot-warn:#ffc86f;
      --dot-ok:#6fffd1;
      --footer-fg:rgba(137,163,173,.85);
    }
    *{box-sizing:border-box}
    html{
      min-height:100%;
      overflow-y:scroll;
      scrollbar-gutter:stable;
      scrollbar-width:thin;
      scrollbar-color:rgba(255,255,255,.14) transparent;
    }
    html::-webkit-scrollbar{
      width:8px;
      height:8px;
    }
    html::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.14);
      border-radius:999px;
    }
    html::-webkit-scrollbar-track{
      background:transparent;
    }
    body{min-height:100%}
    body{
      margin:0;
      color:var(--fg);
      background:
        radial-gradient(1000px 620px at 18% 8%, var(--accent2-fill), transparent 58%),
        radial-gradient(900px 540px at 82% 16%, var(--accent-fill-strong), transparent 60%),
        radial-gradient(720px 420px at 52% 88%, var(--danger-fill), transparent 60%),
        var(--bg);
      font:14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }
    .grid{
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size:44px 44px;
      mask-image:radial-gradient(760px 580px at 50% 14%, #000 40%, transparent 82%);
      opacity:.5;
      pointer-events:none;
    }
    .wrap{
      position:relative;
      width:90%;
      margin:28px auto 40px;
      display:grid;
      gap:16px;
    }
    .card{
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(180deg, var(--surface-top), var(--surface-bottom));
      box-shadow:
        var(--shadow),
        0 0 0 1px var(--surface-inset) inset;
      backdrop-filter:blur(10px);
      overflow:hidden;
      position:relative;
    }
    .main-panel-card{
      display:flex;
      flex-direction:column;
    }
    .main-panel-card > .pad,
    .main-panel-card > .section{
      flex:1 1 auto;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(700px 260px at 20% 0%, var(--accent-fill), transparent 56%),
        radial-gradient(700px 240px at 100% 0%, var(--accent2-fill), transparent 58%);
      pointer-events:none;
    }
    .bar{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 18px;
      min-height:52px;
      border-bottom:1px solid var(--surface-border-faint);
      background:var(--surface-fill);
      box-sizing:border-box;
    }
    .bar-start,
    .bar-end{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .bar-start{flex-wrap:nowrap}
    .bar-end{
      flex:0 0 auto;
      justify-content:flex-end;
      flex-wrap:wrap;
    }
    .dots{display:flex; gap:8px}
    .dots i{width:10px; height:10px; border-radius:999px; display:block}
    .dots i:nth-child(1){background:var(--dot-danger)}
    .dots i:nth-child(2){background:var(--dot-warn)}
    .dots i:nth-child(3){background:var(--dot-ok)}
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--surface-border-soft);
      border-radius:999px;
      padding:6px 10px;
      background:var(--surface-fill);
      white-space:nowrap;
    }
    .status-chip{
      flex:0 0 18ch;
      width:18ch;
      min-width:18ch;
      max-width:18ch;
      justify-content:center;
      text-align:center;
      font-variant-numeric:tabular-nums;
      overflow:hidden;
    }
    .pad,
    .section{
      position:relative;
      z-index:1;
      padding:22px 18px;
    }
    h1{
      margin:8px 0 0;
      font-size:34px;
      letter-spacing:.10em;
      text-transform:uppercase;
      text-shadow:0 0 18px var(--title-glow);
    }
    .hero-title{
      position:relative;
      display:inline-block;
    }
    .signal-title{
      position:relative;
      display:inline-block;
      padding:0 0 10px;
      color:var(--title-text);
      overflow:hidden;
    }
    .signal-title::before{
      content:attr(data-text);
      position:absolute;
      inset:0;
      pointer-events:none;
      color:transparent;
      background:linear-gradient(
        115deg,
        transparent 0%,
        transparent 36%,
        var(--title-sheen) 48%,
        var(--title-beam-strong) 52%,
        transparent 64%,
        transparent 100%
      );
      background-size:220% 100%;
      -webkit-background-clip:text;
      background-clip:text;
      animation:titleSweep 4.8s ease-in-out infinite;
      opacity:.95;
    }
    .signal-title::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:2px;
      border-radius:999px;
      background:linear-gradient(90deg, var(--title-beam-soft), var(--title-beam-strong) 50%, var(--title-beam-soft));
      box-shadow:0 0 0 1px var(--surface-inset), 0 0 16px var(--title-glow);
      transform-origin:left center;
      animation:titleBeam 3.8s ease-in-out infinite;
    }
    @keyframes titleSweep{
      0%, 16%{background-position:160% 0; opacity:0}
      28%{opacity:.98}
      52%{background-position:30% 0; opacity:.9}
      72%, 100%{background-position:-80% 0; opacity:0}
    }
    @keyframes titleBeam{
      0%, 100%{transform:scaleX(.22); opacity:.45}
      45%{transform:scaleX(1); opacity:1}
      70%{transform:scaleX(.72); opacity:.7}
    }
    .sub{
      margin:12px 0 0;
      max-width:80ch;
      color:var(--muted);
      line-height:1.55;
    }
    .eyebrow{
      color:var(--accent);
      letter-spacing:.16em;
      text-transform:uppercase;
      font-size:12px;
    }
    .shell-nav{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:18px;
      align-items:flex-start;
    }
    .shell-nav-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      width:148px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--surface-border-faint);
      background:var(--surface-fill);
      color:var(--fg);
      text-decoration:none;
      font-size:12px;
      white-space:nowrap;
      text-align:center;
      transition:border-color .12s ease, background .12s ease;
    }
    .shell-nav-link:hover{
      border-color:var(--accent-border);
      background:var(--surface-hover);
    }
    .shell-nav-link.active{
      border-color:var(--accent-border-soft);
      background:var(--accent-fill);
      color:var(--accent);
    }
    .hero-tools-section{
      position:relative;
      display:flex;
      align-items:center;
      min-height:60px;
      padding:10px 18px;
      border:1px solid var(--surface-border-faint);
      border-radius:18px;
      background:linear-gradient(180deg, var(--surface-hero-top), var(--surface-hero-bottom));
      box-shadow:
        0 24px 60px rgba(0,0,0,.28),
        0 0 0 1px var(--surface-inset-soft) inset;
    }
    .tool-strip{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      flex-wrap:wrap;
      width:100%;
      min-width:0;
    }
    .page-summary-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:14px;
      align-items:start;
      align-content:start;
    }
    .status-card{
      padding:14px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      background:rgba(0,0,0,.14);
      box-shadow:0 0 0 1px rgba(92,255,214,.05) inset;
      display:grid;
      gap:8px;
    }
    .status-card b{
      font-size:12px;
      color:var(--muted);
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .status-value{
      font-size:20px;
      line-height:1.1;
      letter-spacing:.02em;
    }
    .status-meta{
      font-size:12px;
      color:var(--muted);
    }
    .hero-tools{
      margin-top:0;
      width:100%;
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto;
      gap:12px;
      align-items:center;
    }
    .hero-tools-group{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      min-width:0;
    }
    .hero-tools-group--actions{justify-content:flex-start}
    .hero-tools-group--status{justify-content:flex-end}
    .hero-tools a,
    .hero-tools button,
    .hero-tools label[for]{
      cursor:pointer;
    }
    .section-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }
    .section-title-wrap{
      flex:1 1 auto;
      min-width:0;
    }
    .section-title{
      margin:0;
      font-size:18px;
      letter-spacing:.03em;
      font-weight:600;
    }
    .section-desc{
      margin:6px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .section-tools{
      min-width:0;
      flex:0 0 auto;
    }
    .section-head .tool-strip{
      width:auto;
    }
    .hero-head-pad{
      min-height:156px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }
    .hero-tools .hero-tool-mark{
      appearance:none;
      position:relative;
      isolation:isolate;
      overflow:hidden;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:144px;
      min-height:32px;
      padding:0 14px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:999px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 42%, rgba(255,255,255,0) 100%),
        linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,0) 48%),
        var(--accent-fill-solid);
      color:var(--accent-ink);
      text-decoration:none;
      cursor:pointer;
      font-size:11px;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
      line-height:1.2;
      white-space:nowrap;
      text-align:center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05) inset,
        0 12px 28px rgba(0,0,0,.18),
        0 0 18px var(--accent-shadow);
      transition:border-color .14s ease, transform .14s ease, box-shadow .14s ease, filter .14s ease, opacity .14s ease;
    }
    .hero-tools .hero-tool-mark::before{
      content:"";
      position:absolute;
      inset:1px;
      border-radius:inherit;
      background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0));
      opacity:.28;
      pointer-events:none;
    }
    .hero-tools .hero-tool-mark:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,.16);
      filter:brightness(1.03) saturate(1.04);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.06) inset,
        0 16px 32px rgba(0,0,0,.2),
        0 0 22px var(--accent-shadow);
    }
    .hero-tools .hero-tool-mark:active{
      transform:translateY(0);
      filter:brightness(.99);
    }
    .hero-tools .hero-tool-mark:focus-visible{
      outline:none;
      border-color:rgba(255,255,255,.22);
      box-shadow:
        0 0 0 3px rgba(255,255,255,.08),
        0 0 0 1px rgba(255,255,255,.06) inset,
        0 16px 32px rgba(0,0,0,.2),
        0 0 22px var(--accent-shadow);
    }
    .hero-tools .hero-tool-mark:disabled,
    .hero-tools .hero-tool-mark[disabled],
    .hero-tools .hero-tool-mark[aria-disabled="true"]{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }
    .page-content-grid{
      display:grid;
      gap:16px;
      align-items:start;
      align-content:start;
    }
    .page-content-grid--dashboard{
      display:grid;
      grid-template-columns:minmax(0, 1fr);
      align-items:stretch;
      gap:18px;
    }
    .page-content-grid--dashboard > .card{
      height:100%;
    }
    .status-stack{
      display:grid;
      gap:14px;
      align-content:start;
    }
    .status-list{
      display:grid;
      gap:10px;
      align-content:start;
    }
    .status-list-row{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
    }
    .led{
      width:8px;
      height:8px;
      border-radius:999px;
      background:var(--ok);
      box-shadow:0 0 0 3px rgba(92,255,122,.12), 0 0 14px rgba(92,255,122,.55);
    }
    .status-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      width:14ch;
      min-width:14ch;
      max-width:14ch;
      min-height:34px;
      padding:8px 12px;
      box-sizing:border-box;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      background:rgba(0,0,0,.14);
      font-size:12px;
      color:var(--fg);
      text-align:center;
      font-variant-numeric:tabular-nums;
      overflow:hidden;
    }
    .status-pill code{
      color:var(--accent);
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .tip{
      max-width:72ch;
      color:var(--muted);
      font-size:12px;
      line-height:1.55;
    }
    .tip code{color:var(--accent2)}
    .toast-stage{
      position:fixed;
      top:24px;
      left:50%;
      transform:translateX(-50%);
      z-index:30;
      pointer-events:none;
    }
    .toast{
      min-width:280px;
      max-width:min(420px, calc(100vw - 32px));
      padding:14px 16px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(6,14,20,.88);
      box-shadow:0 18px 44px rgba(0,0,0,.35), 0 0 0 1px rgba(92,255,214,.08) inset;
      backdrop-filter:blur(12px);
      opacity:0;
      transform:translate(-50%, -8px) scale(.98);
      transition:opacity .18s ease, transform .18s ease;
      position:relative;
      left:50%;
    }
    .toast.show{
      opacity:1;
      transform:translate(-50%, 0) scale(1);
    }
    .toast.err{
      border-color:rgba(255,92,154,.26);
      box-shadow:0 18px 44px rgba(0,0,0,.35), 0 0 0 1px rgba(255,92,154,.12) inset;
    }
    .toast-title{
      display:block;
      margin-bottom:4px;
      font-size:13px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--fg);
    }
    .toast-body{
      color:var(--muted);
      font-size:13px;
    }
    .page-footer-slot{
      padding:20px 0 24px;
    }
    .shell-footer{
      margin:0;
      text-align:center;
      color:var(--footer-fg);
      font-size:12px;
    }
    @media (max-width: 920px){
      .page-summary-grid{grid-template-columns:repeat(2, minmax(0, 1fr))}
      .page-content-grid--dashboard{grid-template-columns:1fr}
    }
    @media (max-width: 720px){
      .hero-tools{grid-template-columns:1fr}
      .hero-tools-group--status{justify-content:flex-start}
      .page-summary-grid{grid-template-columns:1fr}
      .page-content-grid--dashboard{grid-template-columns:1fr}
      .section-head{flex-direction:column; align-items:stretch}
    }
    @media (prefers-reduced-motion: reduce){
      .signal-title::before,
      .signal-title::after{
        animation:none !important;
      }
      .signal-title::before{opacity:0}
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="toast-stage" id="toast-stage" aria-live="polite" aria-atomic="true"></div>

  <main class="wrap">
    <section class="card">
      <div class="bar">
        <div class="bar-start">
          <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>
        <div class="bar-end">
          <div class="chip">workspace</div>
        </div>
      </div>
      <div class="pad hero-head-pad">
        <div class="eyebrow">Helix</div>
        <h1><span class="hero-title signal-title" data-text="HELIX FOR MIND">HELIX FOR MIND</span></h1>
        <p class="sub">统一查看常用内容、工作进度与当前状态。</p>
        <div id="page-nav"></div>
      </div>
    </section>

    <section class="hero-tools-section">
      <div class="hero-tools" id="hero-tools"></div>
    </section>

    <section class="page-content-grid page-content-grid--dashboard">
      <section class="card main-panel-card">
        <div class="bar">
          <div class="bar-start">
            <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="chip">overview</div>
          </div>
          <div class="bar-end">
            <div class="chip">status</div>
          </div>
        </div>
        <div class="section">
          <div class="section-head">
            <div class="section-title-wrap">
              <h2 class="section-title">Workspace Overview</h2>
              <p class="section-desc">See the main entry points and current focus.</p>
            </div>
          </div>
          <div class="page-summary-grid" id="overview-cards"></div>
        </div>
      </section>

      <section class="card main-panel-card">
        <div class="bar">
          <div class="bar-start">
            <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="chip">runtime status</div>
          </div>
          <div class="bar-end">
            <div class="chip status-chip" id="refresh-pill">sync pending</div>
          </div>
        </div>
        <div class="section">
          <div class="section-head">
            <div class="section-title-wrap">
              <h2 class="section-title">Runtime Status</h2>
              <p class="section-desc">See current state, recent changes, and sync time.</p>
            </div>
          </div>
          <div class="status-stack">
            <div class="status-list">
              <div class="status-list-row">
                <span class="status-pill" id="status-pill"><span class="led"></span><span id="ready-text">checking</span></span>
              </div>
              <div class="status-list-row">
                <span class="status-pill">Workspace</span>
                <span class="status-pill">Preferences</span>
                <span class="status-pill">Code Studio</span>
                <span class="status-pill">Logs</span>
                <span class="status-pill">Runtime</span>
              </div>
            </div>
            <div class="tip" id="entry-tip"></div>
          </div>
        </div>
      </section>
    </section>

    <div class="page-footer-slot" id="page-footer"></div>
  </main>

  <script>
    const heroToolsHost = document.getElementById("hero-tools");
    const overviewHost = document.getElementById("overview-cards");
    const entryTipHost = document.getElementById("entry-tip");
    const toastStage = document.getElementById("toast-stage");
    const entryConfig = {
      nav: [
        {title: "Workspace", href: "/"},
        {title: "Preferences", href: "/pref"},
        {title: "Code Studio", href: "/code"},
        {title: "Logs", href: "/logs"},
        {title: "Runtime", href: "/idle"},
        {title: "Agent", href: "/agent"}
      ],
      overview: [
        {key: "ready", title: "Ready", value: "Checking", meta: "warming up"},
        {key: "version", title: "Version", value: "Loading", meta: "waiting for update"},
        {key: "idle", title: "Idle Queue", value: "Loading", meta: "waiting for update"},
        {key: "transport", title: "Transport", value: "HTTP", meta: "streamable transport"}
      ],
      heroTools: [
        {
          title: "Preferences",
          description: "Adjust common options.",
          href: "/pref"
        },
        {
          title: "Code Studio",
          description: "Compose and refine content.",
          href: "/code"
        },
        {
          title: "Logs",
          description: "Inspect recent records.",
          href: "/logs"
        },
        {
          title: "Runtime",
          description: "Inspect current activity.",
          href: "/idle"
        }
      ],
      tipLines: [
        "Keyboard: <code>R</code> refresh, <code>P</code> preferences, <code>C</code> code, <code>L</code> logs, <code>I</code> runtime."
      ]
    };

    function showToast(title, detail, kind = ""){
      toastStage.innerHTML = "";
      const toast = document.createElement("div");
      toast.className = kind ? `toast ${kind}` : "toast";
      toast.innerHTML = `
        <strong class="toast-title">${title}</strong>
        <span class="toast-body">${detail}</span>
      `;
      toastStage.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add("show"));
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 180);
      }, 1800);
    }

    function escapeHtml(value){
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function mountNav(targetId, nav, activeHref){
      const root = document.getElementById(targetId);
      if(!root) return;
      root.innerHTML = `
        <nav class="shell-nav" aria-label="workspace">
          ${nav.map((item) => `
            <a class="shell-nav-link${item.href === activeHref ? " active" : ""}" href="${item.href}">
              <span>${escapeHtml(item.title)}</span>
            </a>
          `).join("")}
        </nav>
      `;
    }

    function mountFooter(targetId, text){
      const root = document.getElementById(targetId);
      if(!root) return;
      root.innerHTML = `<div class="shell-footer">${escapeHtml(text)}</div>`;
    }

    function shellMessage(kind){
      const dict = {
        module_open: ["Open Module", "Opening module."],
        synced: ["Synced", "Status updated."],
        sync_failed: ["Sync Failed", "Unable to update status."]
      };
      return dict[kind] || ["Notice", ""];
    }

    function renderOverview(cards){
      overviewHost.innerHTML = cards.map((card) => `
        <div class="status-card">
          <b>${card.title}</b>
          <div class="status-value" data-value="${card.key}">${card.value}</div>
          <div class="status-meta" data-meta="${card.key}">${card.meta}</div>
        </div>
      `).join("");
    }

    function summarizeIdle(payload){
      const pendingCount = Array.isArray(payload.pending)
        ? payload.pending.length
        : Array.isArray(payload.jobs)
          ? payload.jobs.length
          : typeof payload.pending_total === "number"
            ? payload.pending_total
            : typeof payload.total === "number"
              ? payload.total
              : 0;
      const sessionCount = payload.sessions && typeof payload.sessions === "object"
        ? Object.keys(payload.sessions).length
        : typeof payload.active_sessions === "number"
          ? payload.active_sessions
          : 0;
      const runningCount = Array.isArray(payload.running)
        ? payload.running.length
        : typeof payload.running_total === "number"
          ? payload.running_total
          : sessionCount;
      const total = pendingCount + runningCount;

      let meta = "queue is clear";
      if(runningCount && pendingCount){
        meta = `${runningCount} running · ${pendingCount} pending`;
      }else if(runningCount){
        meta = `${runningCount} active job${runningCount > 1 ? "s" : ""}`;
      }else if(pendingCount){
        meta = `${pendingCount} queued job${pendingCount > 1 ? "s" : ""}`;
      }

      return {value: String(total), meta};
    }

    function renderHeroTools(entries){
      heroToolsHost.innerHTML = `
        <div class="hero-tools-group hero-tools-group--actions">
          ${entries.map((entry) => `
            <a class="hero-tool-mark" href="${entry.href}" title="${escapeHtml(entry.description)}">${entry.title}</a>
          `).join("")}
        </div>
      `;
    }

    function renderTip(lines){
      entryTipHost.innerHTML = lines.map((line) => `<div>${line}</div>`).join("");
    }

    renderHeroTools(entryConfig.heroTools);
    renderTip(entryConfig.tipLines);
    mountNav("page-nav", entryConfig.nav, "/");
    mountFooter("page-footer", "HELIX · workspace · v__APP_VERSION__");
    renderOverview(entryConfig.overview);

    let statusLoadTask = null;

    async function loadStatus(){
      if(statusLoadTask) return statusLoadTask;
      statusLoadTask = (async () => {
      const readyText      = document.getElementById("ready-text");
      const refreshPill    = document.getElementById("refresh-pill");
      const readyValue     = document.querySelector('[data-value="ready"]');
      const readyMeta      = document.querySelector('[data-meta="ready"]');
      const versionValue   = document.querySelector('[data-value="version"]');
      const versionMeta    = document.querySelector('[data-meta="version"]');
      const idleValue      = document.querySelector('[data-value="idle"]');
      const idleMeta       = document.querySelector('[data-meta="idle"]');
      const transportValue = document.querySelector('[data-value="transport"]');
      const transportMeta  = document.querySelector('[data-meta="transport"]');

      refreshPill.textContent    = "syncing";
      transportValue.textContent = "HTTP";
      transportMeta.textContent  = "streamable transport";

      try{
        const readyResp = await fetch("/ready", {cache: "no-store"});
        const readyOk = readyResp.ok;
        readyText.textContent = readyOk ? "online" : "degraded";
        readyValue.textContent = readyOk ? "Online" : "Degraded";
        readyMeta.textContent = readyOk ? "runtime reachable" : "status endpoint degraded";
      }catch(_err){
        readyText.textContent = "offline";
        readyValue.textContent = "Offline";
        readyMeta.textContent = "status endpoint unreachable";
      }

      try{
        const versionResp = await fetch("/version", {cache: "no-store"});
        if(versionResp.ok){
          const payload = await versionResp.json();
          if(payload.version){
            versionValue.textContent = payload.version;
            versionMeta.textContent = "version confirmed";
          }
        }
      }catch(_err){
        versionValue.textContent = "N/A";
        versionMeta.textContent = "version unavailable";
      }

      try{
        const idleResp = await fetch("/api/idle", {cache: "no-store"});
        if(idleResp.ok){
          const payload = await idleResp.json();
          const idle = summarizeIdle(payload);
          idleValue.textContent = idle.value;
          idleMeta.textContent = idle.meta;
        }else{
          idleValue.textContent = "N/A";
          idleMeta.textContent = "idle snapshot unavailable";
        }
      }catch(_err){
        idleValue.textContent = "N/A";
        idleMeta.textContent = "idle endpoint unreachable";
      }

      refreshPill.textContent = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
      })();
      try{
        return await statusLoadTask;
      }finally{
        statusLoadTask = null;
      }
    }

    loadStatus();

    document.getElementById("page-nav").addEventListener("click", (event) => {
      const link = event.target.closest("a");
      if(!link) return;
      const [title] = shellMessage("module_open");
      showToast(title, `Open ${link.getAttribute("href")}`, "");
    });

    heroToolsHost.addEventListener("click", (event) => {
      const link = event.target.closest("a");
      if(!link) return;
      const [title] = shellMessage("module_open");
      showToast(title, `Open ${link.getAttribute("href")}`, "");
    });

    window.addEventListener("keydown", (e) => {
      const k = (e.key || "").toLowerCase();
      if (k === "r"){
        loadStatus()
          .then(() => {
            const [title, detail] = shellMessage("synced");
            showToast(title, detail, "");
          })
          .catch(() => {
            const [title, detail] = shellMessage("sync_failed");
            showToast(title, detail, "err");
          });
      }
      if (k === "p") location.href = "/pref";
      if (k === "c") location.href = "/code";
      if (k === "l") location.href = "/logs";
      if (k === "i") location.href = "/idle";
    });
  </script>
</body>
</html>
